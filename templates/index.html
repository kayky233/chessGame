/* ================================================================
   Board Drawing (SVG) — reads skin colors
   ================================================================ */
function drawBoard() {
    const svg = document.getElementById('board-svg');
    svg.innerHTML = '';
    const ns = 'http://www.w3.org/2000/svg';
    const skin = getSkin(currentSkinId);
    const lineColor = skin.vars['--line-color'];
    const riverColor = skin.vars['--river-text'];

    function addLine(x1, y1, x2, y2, w) {
        const el = document.createElementNS(ns, 'line');
        el.setAttribute('x1', x1); el.setAttribute('y1', y1);
        el.setAttribute('x2', x2); el.setAttribute('y2', y2);
        el.setAttribute('stroke', lineColor);
        el.setAttribute('stroke-width', w || 1.5);
        svg.appendChild(el);
    }

    function addText(x, y, text, size) {
        const el = document.createElementNS(ns, 'text');
        el.setAttribute('x', x); el.setAttribute('y', y);
        el.setAttribute('text-anchor', 'middle');
        el.setAttribute('dominant-baseline', 'central');
        el.setAttribute('font-size', size || 26);
        el.setAttribute('fill', riverColor);
        el.setAttribute('font-family', 'KaiTi, STKaiti, FangSong, serif');
        el.setAttribute('opacity', '0.75');
        el.textContent = text;
        svg.appendChild(el);
    }

    /* Outer border */
    const bx = HALF - 4, by = HALF - 4;
    const bw = 8 * CS + 8, bh = 9 * CS + 8;
    const rect = document.createElementNS(ns, 'rect');
    rect.setAttribute('x', bx); rect.setAttribute('y', by);
    rect.setAttribute('width', bw); rect.setAttribute('height', bh);
    rect.setAttribute('fill', 'none');
    rect.setAttribute('stroke', lineColor);
    rect.setAttribute('stroke-width', 2.5);
    svg.appendChild(rect);

    /* Horizontal lines */
    for (let r = 0; r < 10; r++) {
        addLine(HALF, r * CS + HALF, 8 * CS + HALF, r * CS + HALF);
    }
    /* Vertical lines — top half */
    for (let c = 0; c < 9; c++) {
        addLine(c * CS + HALF, HALF, c * CS + HALF, 4 * CS + HALF);
    }
    /* Vertical lines — bottom half */
    for (let c = 0; c < 9; c++) {
        addLine(c * CS + HALF, 5 * CS + HALF, c * CS + HALF, 9 * CS + HALF);
    }
    /* Edge verticals across river */
    addLine(HALF, 4 * CS + HALF, HALF, 5 * CS + HALF);
    addLine(8 * CS + HALF, 4 * CS + HALF, 8 * CS + HALF, 5 * CS + HALF);

    /* Palace diagonals */
    addLine(3*CS+HALF, 0*CS+HALF, 5*CS+HALF, 2*CS+HALF);
    addLine(5*CS+HALF, 0*CS+HALF, 3*CS+HALF, 2*CS+HALF);
    addLine(3*CS+HALF, 7*CS+HALF, 5*CS+HALF, 9*CS+HALF);
    addLine(5*CS+HALF, 7*CS+HALF, 3*CS+HALF, 9*CS+HALF);

    /* Star marks */
    const stars = [
        [2,1],[2,7],[7,1],[7,7],
        [3,0],[3,2],[3,4],[3,6],[3,8],
        [6,0],[6,2],[6,4],[6,6],[6,8],
    ];
    const sd = 5, sl = 11;
    for (const [row, col] of stars) {
        const cx = col * CS + HALF, cy = row * CS + HALF;
        if (col < 8) {
            addLine(cx+sd, cy-sd, cx+sl, cy-sd, 1);
            addLine(cx+sd, cy-sd, cx+sd, cy-sl, 1);
            addLine(cx+sd, cy+sd, cx+sl, cy+sd, 1);
            addLine(cx+sd, cy+sd, cx+sd, cy+sl, 1);
        }
        if (col > 0) {
            addLine(cx-sd, cy-sd, cx-sl, cy-sd, 1);
            addLine(cx-sd, cy-sd, cx-sd, cy-sl, 1);
            addLine(cx-sd, cy+sd, cx-sl, cy+sd, 1);
            addLine(cx-sd, cy+sd, cx-sd, cy+sl, 1);
        }
    }

    /* River text */
    addText(2 * CS + HALF, 4.5 * CS + HALF, '楚  河', 30);
    addText(6 * CS + HALF, 4.5 * CS + HALF, '漢  界', 30);
}

/* ================================================================
   Rendering
   ================================================================ */
function renderPieces() {
    const grid = document.getElementById('pieces-grid');
    grid.innerHTML = '';

    for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 9; c++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.row = r;
            cell.dataset.col = c;
            cell.addEventListener('click', () => handleClick(r, c));

            if (lastMove) {
                if (r === lastMove.fr && c === lastMove.fc) cell.classList.add('last-from');
                if (r === lastMove.tr && c === lastMove.tc) cell.classList.add('last-to');
            }
            if (lastCapture && r === lastCapture.r && c === lastCapture.c) {
                cell.classList.add('capture');
            }

            const piece = board[r][c];
            const isValidTarget = validMoves.some(m => m[0] === r && m[1] === c);

            if (piece) {
                const div = document.createElement('div');
                div.className = 'piece ' + (piece[0] === 'r' ? 'red' : 'black');
                div.textContent = PIECE_CHAR[piece] || '?';

                if (selectedPos && selectedPos[0] === r && selectedPos[1] === c) {
                    div.classList.add('selected');
                }
                if (lastMove && lastMove.tr === r && lastMove.tc === c) {
                    div.classList.add('moved');
                }
                if (isValidTarget) {
                    cell.classList.add('valid-capture');
                }
                cell.appendChild(div);
            } else {
                if (isValidTarget) {
                    cell.classList.add('valid-move');
                }
            }

            grid.appendChild(cell);
        }
    }
}

/* ================================================================
   Move Generation (Client-Side)
   ================================================================ */
const MA_DELTAS = [
    [-1, 0, -2, -1], [-1, 0, -2, 1],
    [1, 0, 2, -1], [1, 0, 2, 1],
    [0, -1, -1, -2], [0, -1, 1, -2],
    [0, 1, -1, 2], [0, 1, 1, 2],
];
const ORTHO_DIRS = [[-1,0],[1,0],[0,-1],[0,1]];
const DIAG_DIRS = [[-1,-1],[-1,1],[1,-1],[1,1]];

function inBoard(r, c) { return r >= 0 && r < 10 && c >= 0 && c < 9; }

function getRawMoves(b, r, c) {
    const p = b[r][c];
    if (!p) return [];
    const color = p[0], type = p.substring(2);
    const moves = [];
    switch (type) {
        case 'che':   _genChe(b, r, c, color, moves); break;
        case 'pao':   _genPao(b, r, c, color, moves); break;
        case 'ma':    _genMa(b, r, c, color, moves); break;
        case 'xiang': _genXiang(b, r, c, color, moves); break;
        case 'shi':   _genShi(b, r, c, color, moves); break;
        case 'jiang': case 'shuai': _genKing(b, r, c, color, moves); break;
        case 'zu': case 'bing':     _genBing(b, r, c, color, moves); break;
    }
    return moves;
}

function _genChe(b, r, c, color, moves) {
    for (const [dr, dc] of ORTHO_DIRS) {
        let nr = r+dr, nc = c+dc;
        while (inBoard(nr, nc)) {
            const t = b[nr][nc];
            if (!t) { moves.push([nr, nc]); }
            else { if (t[0] !== color) moves.push([nr, nc]); break; }
            nr += dr; nc += dc;
        }
    }
}

function _genPao(b, r, c, color, moves) {
    for (const [dr, dc] of ORTHO_DIRS) {
        let nr = r+dr, nc = c+dc;
        while (inBoard(nr, nc)) {
            if (!b[nr][nc]) { moves.push([nr, nc]); }
            else {
                nr += dr; nc += dc;
                while (inBoard(nr, nc)) {
                    const t = b[nr][nc];
                    if (t) { if (t[0] !== color) moves.push([nr, nc]); break; }
                    nr += dr; nc += dc;
                }
                break;
            }
            nr += dr; nc += dc;
        }
    }
}

function _genMa(b, r, c, color, moves) {
    for (const [ldr, ldc, ddr, ddc] of MA_DELTAS) {
        const lr = r+ldr, lc = c+ldc;
        if (!inBoard(lr, lc) || b[lr][lc]) continue;
        const nr = r+ddr, nc = c+ddc;
        if (inBoard(nr, nc)) {
            const t = b[nr][nc];
            if (!t || t[0] !== color) moves.push([nr, nc]);
        }
    }
}

function _genXiang(b, r, c, color, moves) {
    for (const [dr, dc] of DIAG_DIRS) {
        const nr = r+2*dr, nc = c+2*dc;
        if (!inBoard(nr, nc)) continue;
        if (color === 'b' && nr > 4) continue;
        if (color === 'r' && nr < 5) continue;
        if (b[r+dr][c+dc]) continue;
        const t = b[nr][nc];
        if (!t || t[0] !== color) moves.push([nr, nc]);
    }
}

function _genShi(b, r, c, color, moves) {
    for (const [dr, dc] of DIAG_DIRS) {
        const nr = r+dr, nc = c+dc;
        if (nc < 3 || nc > 5) continue;
        if (color === 'b' && (nr < 0 || nr > 2)) continue;
        if (color === 'r' && (nr < 7 || nr > 9)) continue;
        const t = b[nr][nc];
        if (!t || t[0] !== color) moves.push([nr, nc]);
    }
}

function _genKing(b, r, c, color, moves) {
    for (const [dr, dc] of ORTHO_DIRS) {
        const nr = r+dr, nc = c+dc;
        if (nc < 3 || nc > 5) continue;
        if (color === 'b' && (nr < 0 || nr > 2)) continue;
        if (color === 'r' && (nr < 7 || nr > 9)) continue;
        const t = b[nr][nc];
        if (!t || t[0] !== color) moves.push([nr, nc]);
    }
    const targetKing = color === 'b' ? 'r_shuai' : 'b_jiang';
    const step = color === 'b' ? 1 : -1;
    let nr = r + step;
    while (nr >= 0 && nr < 10) {
        const t = b[nr][c];
        if (t) { if (t === targetKing) moves.push([nr, c]); break; }
        nr += step;
    }
}

function _genBing(b, r, c, color, moves) {
    if (color === 'b') {
        if (r+1 < 10 && (!b[r+1][c] || b[r+1][c][0] !== color)) moves.push([r+1, c]);
        if (r >= 5) {
            if (c-1 >= 0 && (!b[r][c-1] || b[r][c-1][0] !== color)) moves.push([r, c-1]);
            if (c+1 <  9 && (!b[r][c+1] || b[r][c+1][0] !== color)) moves.push([r, c+1]);
        }
    } else {
        if (r-1 >= 0 && (!b[r-1][c] || b[r-1][c][0] !== color)) moves.push([r-1, c]);
        if (r <= 4) {
            if (c-1 >= 0 && (!b[r][c-1] || b[r][c-1][0] !== color)) moves.push([r, c-1]);
            if (c+1 <  9 && (!b[r][c+1] || b[r][c+1][0] !== color)) moves.push([r, c+1]);
        }
    }
}

/* ================================================================
   Legal Move Filtering
   ================================================================ */
function isInCheck(b, color) {
    const kingName = color === 'r' ? 'r_shuai' : 'b_jiang';
    let kr = -1, kc = -1;
    for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 9; c++) {
            if (b[r][c] === kingName) { kr = r; kc = c; }
        }
    }
    if (kr < 0) return true;

    const enemy = color === 'r' ? 'b' : 'r';
    for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 9; c++) {
            if (b[r][c] && b[r][c][0] === enemy) {
                const targets = getRawMoves(b, r, c);
                for (const [tr, tc] of targets) {
                    if (tr === kr && tc === kc) return true;
                }
            }
        }
    }
    return false;
}

function getLegalMoves(b, r, c) {
    const raw = getRawMoves(b, r, c);
    const color = b[r][c][0];
    const legal = [];
    for (const [tr, tc] of raw) {
        const saved = b[tr][tc];
        const piece = b[r][c];
        b[tr][tc] = piece;
        b[r][c] = null;
        if (!isInCheck(b, color)) legal.push([tr, tc]);
        b[r][c] = piece;
        b[tr][tc] = saved;
    }
    return legal;
}

function hasAnyLegalMove(b, color) {
    for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 9; c++) {
            if (b[r][c] && b[r][c][0] === color) {
                if (getLegalMoves(b, r, c).length > 0) return true;
            }
        }
    }
    return false;
}

/* ================================================================
   Click Handler
   ================================================================ */
function handleClick(r, c) {
    if (gameOver) return;
    if (puzzleActive && currentTurn !== puzzleSide) return;
    if (!puzzleActive && currentTurn !== 'r') return;
    const piece = board[r][c];

    if (selectedPos) {
        if (validMoves.some(m => m[0] === r && m[1] === c)) {
            const [fr, fc] = selectedPos;
            const targetBefore = board[r][c]; /* piece about to be captured */
            saveHistory();
            doMove(fr, fc, r, c);
            selectedPos = null;
            validMoves = [];
            renderPieces();

            /* Player captured an AI piece → character reacts */
            if (targetBefore && targetBefore[0] === 'b' && isCharacterMode(currentDifficulty)) {
                if (targetBefore === 'b_jiang') {
                    fetchEventDialogue(currentDifficulty, 'lose');
                } else {
                    fetchEventDialogue(currentDifficulty, 'captured');
                }
            }

            if (!gameOver) {
                if (puzzleActive) {
                    afterPuzzleMove();
                    return;
                }
                currentTurn = 'b';
                setStatus('AI 思考中...');
                showOverlay(true);
                setTimeout(requestAIMove, 50);
            }
            return;
        }
        if (piece && piece[0] === 'r') {
            selectedPos = [r, c];
            validMoves = getLegalMoves(board, r, c);
            renderPieces();
            return;
        }
        selectedPos = null;
        validMoves = [];
        renderPieces();
        return;
    }

    if (piece && piece[0] === currentTurn) {
        selectedPos = [r, c];
        validMoves = getLegalMoves(board, r, c);
        renderPieces();
    }
}

/* ================================================================
   Move Execution (with win tracking)
   ================================================================ */
function doMove(fr, fc, tr, tc) {
    const captured = board[tr][tc];
    board[tr][tc] = board[fr][fc];
    board[fr][fc] = null;
    lastMove = { fr, fc, tr, tc };
    lastCapture = captured ? { r: tr, c: tc } : null;
    lastCapturedPiece = captured || null;

    if (captured) {
        if (captured === 'b_jiang') {
            gameOver = true;
            setStatus('红方胜利！');
            showOverlay(false);
            if (!puzzleActive) {
                /* --- Win tracking --- */
                wins++;
                updateWinCounter();
                saveProfile();
                checkUnlock();
            }
        } else if (captured === 'r_shuai') {
            gameOver = true;
            setStatus('黑方胜利！');
            showOverlay(false);
        }
    }
}

function afterPuzzleMove() {
    puzzleMoves += 1;
    const targetKing = puzzleSide === 'r' ? 'b_jiang' : 'r_shuai';

    if (gameOver && lastCapturedPiece === targetKing) {
            setStatus('残局成功！');
            document.getElementById('info-bar').textContent = '通关完成';
            markPuzzleCleared(puzzleId, puzzleMoves);
            renderPuzzleList();
            const next = getNextPuzzle(puzzleId);
            if (next) {
                setTimeout(() => {
                    const goNext = window.confirm('通关成功！是否进入下一关？');
                    if (goNext) {
                        startPuzzle(next);
                    } else {
                        openPuzzlePanel();
                    }
                }, 50);
            } else {
                setTimeout(() => openPuzzlePanel(), 50);
            }
            return;
    }

    if (puzzleMoves >= puzzleMaxMoves) {
        gameOver = true;
        setStatus('挑战失败（超出步数）');
        document.getElementById('info-bar').textContent = '请重试';
        return;
    }

    updatePuzzleStatus();
}

function getNextPuzzle(id) {
    const idx = PUZZLES.findIndex(p => p.id === id);
    if (idx < 0 || idx >= PUZZLES.length - 1) return null;
    const next = PUZZLES[idx + 1];
    const prevId = PUZZLES[idx].id;
    if (puzzleProgress[prevId] && puzzleProgress[prevId].cleared) {
        return next;
    }
    return null;
}

function saveHistory() {
    history.push({
        board: board.map(row => [...row]),
        lastMove: lastMove ? { ...lastMove } : null,
        turn: currentTurn,
        puzzleActive: puzzleActive,
        puzzleId: puzzleId,
        puzzleMoves: puzzleMoves,
        puzzleMaxMoves: puzzleMaxMoves,
        puzzleSide: puzzleSide,
    });
}

/* ================================================================
   AI Communication
   ================================================================ */
async function requestAIMove() {
    try {
        const isChar = isCharacterMode(currentDifficulty);
        const diff = getDifficulty(currentDifficulty);
        const body = isChar
            ? { board, character: currentDifficulty }
            : { board, depth: diff.depth };

        const res = await fetch('/ai-move', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
        });
        const data = await res.json();
        showOverlay(false);

        /* Show dialogue if present */
        if (data.dialogue) {
            showDialogue(CHARACTER_NAMES[currentDifficulty] || '?', data.dialogue, data.event);
        }

        if (data.status === 'ok' && data.move) {
            const { from, to } = data.move;
            saveHistory();
            doMove(from[0], from[1], to[0], to[1]);
            renderPieces();

            const label = isChar ? CHARACTER_NAMES[currentDifficulty] : ('难度: ' + diff.name);
            const info = label + ' | AI: ' + (data.nodes || '?') + ' 节点, ' + (data.time || '?') + 's';
            document.getElementById('info-bar').textContent = info;

            if (!gameOver) {
                currentTurn = 'r';
                if (!hasAnyLegalMove(board, 'r')) {
                    gameOver = true;
                    setStatus('黑方胜利！（绝杀）');
                    if (isCharacterMode(currentDifficulty)) {
                        fetchEventDialogue(currentDifficulty, 'win');
                    }
                } else if (isInCheck(board, 'r')) {
                    setStatus('将军！ 红方回合');
                    if (isCharacterMode(currentDifficulty)) {
                        fetchEventDialogue(currentDifficulty, 'check');
                    }
                } else {
                    setStatus('红方回合');
                }
            }
        } else {
            gameOver = true;
            setStatus('红方胜利！（AI无子可走）');
            if (data.dialogue) {
                showDialogue(CHARACTER_NAMES[currentDifficulty] || '?', data.dialogue, 'lose');
            }
            wins++;
            updateWinCounter();
            saveProfile();
            checkUnlock();
        }
    } catch (err) {
        showOverlay(false);
        currentTurn = 'r';
        setStatus('网络错误，请重试');
        console.error('AI request failed:', err);
    }
}

/* ================================================================
   Dialogue UI (Galgame Bubble + Typewriter + Expression)
   ================================================================ */
let dialogueTimer = null;
let typewriterTimer = null;

function eventToExpression(event) {
    if (event === 'capture' || event === 'win' || event === 'check') return 'happy';
    if (event === 'captured' || event === 'lose') return 'angry';
    return 'normal';
}

function setExpression(expression) {
    if (currentCharacterId) {
        drawCharPortrait(document.getElementById('char-portrait-svg'), currentCharacterId, expression || 'normal');
    }
}

function showDialogue(name, text, event) {
    const bubble = document.getElementById('dialogue-bubble');
    const nameEl = document.getElementById('bubble-name');
    const textEl = document.getElementById('bubble-text');

    nameEl.textContent = name;
    bubble.classList.add('show');

    // Expression
    setExpression(eventToExpression(event || ''));

    // Typewriter effect
    clearInterval(typewriterTimer);
    clearTimeout(dialogueTimer);
    const fullText = '「' + text + '」';
    let i = 0;
    textEl.innerHTML = '<span class="bubble-cursor"></span>';
    typewriterTimer = setInterval(() => {
        if (i < fullText.length) {
            textEl.innerHTML = fullText.slice(0, i + 1) + '<span class="bubble-cursor"></span>';
            i++;
        } else {
            clearInterval(typewriterTimer);
            textEl.innerHTML = fullText;
            // Reset expression after a while
            dialogueTimer = setTimeout(() => {
                setExpression('normal');
            }, 4000);
        }
    }, 45);
}

function hideDialogue() {
    const bubble = document.getElementById('dialogue-bubble');
    bubble.classList.remove('show');
    clearInterval(typewriterTimer);
    clearTimeout(dialogueTimer);
}

let llmEnabled = false;
/* Check LLM status on load */
fetch('/llm-status').then(r => r.json()).then(d => {
    llmEnabled = d.enabled;
}).catch(() => {});

function fetchDialogueStream(charId, event) {
    const name = CHARACTER_NAMES[charId] || '?';
    const bubble = document.getElementById('dialogue-bubble');
    const nameEl = document.getElementById('bubble-name');
    const textEl = document.getElementById('bubble-text');

    nameEl.textContent = name;
    bubble.classList.add('show');
    setExpression(eventToExpression(event || ''));
    clearInterval(typewriterTimer);
    clearTimeout(dialogueTimer);

    let buffer = '';
    textEl.innerHTML = '「<span class="bubble-cursor"></span>';

    fetch('/dialogue-stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ character: charId, event }),
    }).then(response => {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let partial = '';

        function read() {
            reader.read().then(({ done, value }) => {
                if (done) {
                    textEl.textContent = '「' + buffer + '」';
                    dialogueTimer = setTimeout(() => setExpression('normal'), 4000);
                    return;
                }
                partial += decoder.decode(value, { stream: true });
                const lines = partial.split('\n');
                partial = lines.pop(); // keep incomplete line
                for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    try {
                        const chunk = JSON.parse(line.slice(6));
                        if (chunk.full) {
                            buffer = chunk.full;
                            textEl.textContent = '「' + buffer + '」';
                        } else if (chunk.t) {
                            buffer += chunk.t;
                            textEl.innerHTML = '「' + buffer + '<span class="bubble-cursor"></span>';
                        }
                        if (chunk.done) {
                            textEl.textContent = '「' + buffer + '」';
                            dialogueTimer = setTimeout(() => setExpression('normal'), 4000);
                            return;
                        }
                    } catch (_) {}
                }
                read();
            });
        }
        read();
    }).catch(() => {
        // Fallback to non-stream
        fetchDialogueFallback(charId, event);
    });
}

async function fetchDialogueFallback(charId, event) {
    try {
        const res = await fetch('/dialogue', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ character: charId, event }),
        });
        const data = await res.json();
        if (data.dialogue) {
            showDialogue(CHARACTER_NAMES[charId] || '?', data.dialogue, event);
        }
    } catch (_) {}
}

async function fetchStartDialogue(charId) {
    if (llmEnabled) {
        fetchDialogueStream(charId, 'start');
    } else {
        fetchDialogueFallback(charId, 'start');
    }
}

async function fetchEventDialogue(charId, event) {
    if (llmEnabled) {
        fetchDialogueStream(charId, event);
    } else {
        fetchDialogueFallback(charId, event);
    }
}

/* ================================================================
   UI Helpers
   ================================================================ */
function setStatus(text) {
    document.getElementById('status').textContent = text;
}

function showOverlay(show) {
    const el = document.getElementById('overlay');
    if (show) el.classList.add('show');
    else el.classList.remove('show');
}

function undoMove() {
    if (puzzleActive) {
        setStatus('残局模式不支持悔棋');
        document.getElementById('info-bar').textContent = '请重新挑战该关卡';
        return;
    }
    if (history.length < 2 || gameOver) return;
    history.pop();
    const prev = history.pop();
    board = prev.board;
    lastMove = prev.lastMove;
    lastCapture = null;
    lastCapturedPiece = null;
    currentTurn = prev.turn || 'r';
    puzzleActive = prev.puzzleActive || false;
    puzzleId = prev.puzzleId || null;
    puzzleMoves = prev.puzzleMoves || 0;
    puzzleMaxMoves = prev.puzzleMaxMoves || 0;
    puzzleSide = prev.puzzleSide || 'r';
    selectedPos = null;
    validMoves = [];
    if (puzzleActive) {
        updatePuzzleStatus();
    } else {
        setStatus('红方回合');
        document.getElementById('info-bar').textContent = '';
    }
    renderPieces();
}

function newGame() {
    board = INITIAL_BOARD.map(row => [...row]);
    selectedPos = null;
    validMoves = [];
    currentTurn = 'r';
    gameOver = false;
    lastMove = null;
    lastCapture = null;
    lastCapturedPiece = null;
    history = [];
    puzzleActive = false;
    puzzleId = null;
    puzzleMoves = 0;
    puzzleMaxMoves = 0;
    puzzleSide = 'r';
    setStatus('红方回合');
    showOverlay(false);
    document.getElementById('info-bar').textContent = '';
    hideDialogue();
    renderPieces();

    /* Character start dialogue */
    if (isCharacterMode(currentDifficulty)) {
        fetchStartDialogue(currentDifficulty);
    }
}

/* ================================================================
   Init
   ================================================================ */
/* ============================================================
   resizeStage() — Cinema Mode board scaling
   Computes the perfect scale factor for the board panel so it
   fits inside the fixed-ratio stage without overflow.
   Called on init, window resize, and orientation change.
   ============================================================ */
function resizeStage() {
    const stage = document.getElementById('game-stage');
    const panel = document.getElementById('game-panel');
    if (!stage || !panel) return;

    const sh = stage.clientHeight;
    const sw = stage.clientWidth;
    const isPortrait = sw < sh; // portrait mode (9:16)

    // Board panel natural dimensions: 576px wide, ~760px tall
    const PANEL_W = 576;
    const PANEL_H = 760;

    let scale;
    if (isPortrait) {
        // Portrait: board must fit the stage WIDTH (with margins)
        const availW = sw * 0.92;  // 92% of stage width
        const availH = sh * 0.55;  // 55% of stage height (top half)
        scale = Math.min(availW / PANEL_W, availH / PANEL_H);
    } else {
        // Landscape: board must fit the stage HEIGHT
        const availH = sh * 0.88;  // 88% of stage height
        const availW = sw * 0.42;  // 42% of stage width (right half)
        scale = Math.min(availH / PANEL_H, availW / PANEL_W);
    }
    scale = Math.min(scale, 1); // Never scale UP beyond native size

    stage.style.setProperty('--board-scale', scale.toFixed(4));
}

function init() {
    // Cinema Mode: compute board scale on load and resize
    resizeStage();
    window.addEventListener('resize', resizeStage);
    window.addEventListener('orientationchange', () => setTimeout(resizeStage, 200));

    loadProfile();
    initLive2D();
    applySkin(currentSkinId);
    updateWinCounter();
    updateCharPanel();
    newGame();

    document.getElementById('btn-new').addEventListener('click', newGame);
    document.getElementById('btn-undo').addEventListener('click', undoMove);
    document.getElementById('btn-puzzle').addEventListener('click', openPuzzlePanel);
    document.getElementById('btn-skin').addEventListener('click', openSkinPanel);
    document.getElementById('btn-char').addEventListener('click', openCharSelect);
    document.getElementById('skin-close').addEventListener('click', closeSkinPanel);
    document.getElementById('skin-backdrop').addEventListener('click', closeSkinPanel);
    document.getElementById('puzzle-close').addEventListener('click', closePuzzlePanel);
    document.getElementById('puzzle-backdrop').addEventListener('click', closePuzzlePanel);
    document.getElementById('char-select-close').addEventListener('click', closeCharSelect);
    document.getElementById('char-select-backdrop').addEventListener('click', closeCharSelect);

    // Free mode button
    document.getElementById('btn-free-mode').addEventListener('click', () => {
        selectCharacter(null);
    });

    const diffSelect = document.getElementById('difficulty-select');
    if (!isCharacterMode(currentDifficulty)) {
        diffSelect.value = currentDifficulty;
    }
    diffSelect.addEventListener('change', () => {
        currentDifficulty = diffSelect.value;
        saveProfile();
    });
}

window.addEventListener('DOMContentLoaded', init);
</script>
