<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国象棋</title>
<style>
/* ============================================================
   CSS Custom Properties (Classic skin defaults)
   ============================================================ */
:root {
    --body-bg: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    --board-bg: #DEB887;
    --board-border: #5D3A1A;
    --board-outline: #3E2310;
    --board-shadow: 0 10px 50px rgba(0,0,0,0.6), inset 0 0 30px rgba(93,58,26,0.15);
    --line-color: #5D3A1A;
    --river-text: #7B5B3A;
    --piece-bg: radial-gradient(circle at 38% 30%, #FFF8E7, #DEB887 55%, #B8860B 100%);
    --piece-border: #8B6914;
    --piece-shadow: 2px 3px 6px rgba(0,0,0,0.35), inset 0 1px 3px rgba(255,255,255,0.35);
    --piece-hover-shadow: 3px 4px 10px rgba(0,0,0,0.45), inset 0 1px 3px rgba(255,255,255,0.35);
    --red-color: #C41E3A;
    --black-color: #1A1A1A;
    --selected-glow: #FFD700;
    --title-color: #e6d5a8;
    --status-color: #e6d5a8;
    --btn-bg: linear-gradient(180deg, #A0522D, #8B4513);
    --btn-bg-hover: linear-gradient(180deg, #B5623A, #A0522D);
    --btn-border: #D2691E;
    --btn-color: #FFF8E7;
    --overlay-text: #FFD700;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: var(--body-bg);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px 0;
    font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif;
    transition: background 0.5s ease;
}

#app {
    text-align: center;
}

h1 {
    color: var(--title-color);
    font-size: 30px;
    margin-bottom: 16px;
    letter-spacing: 6px;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
    transition: color 0.4s;
}

.board-container {
    position: relative;
    display: inline-block;
    width: 576px;
    height: 640px;
    border: 6px solid var(--board-border);
    border-radius: 6px;
    box-shadow: var(--board-shadow);
    background: var(--board-bg);
    outline: 3px solid var(--board-outline);
    outline-offset: 2px;
    transition: background 0.5s, border-color 0.5s, box-shadow 0.5s, outline-color 0.5s;
}

#board-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
}

#pieces-grid {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: grid;
    grid-template-columns: repeat(9, 64px);
    grid-template-rows: repeat(10, 64px);
}

.cell {
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    z-index: 1;
}

.cell.last-from { background: rgba(255, 200, 0, 0.22); }
.cell.last-to   { background: rgba(255, 200, 0, 0.32); }

.cell.valid-move::before {
    content: '';
    position: absolute;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: rgba(0, 160, 0, 0.5);
    box-shadow: 0 0 6px rgba(0, 160, 0, 0.4);
    z-index: 2;
}

.cell.valid-capture .piece {
    box-shadow: 0 0 0 3px rgba(220, 0, 0, 0.65),
                2px 3px 6px rgba(0,0,0,0.3),
                inset 0 1px 3px rgba(255,255,255,0.3);
}

.cell.capture::after {
    content: '';
    position: absolute;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(220, 0, 0, 0.18);
    box-shadow: 0 0 14px rgba(220, 0, 0, 0.6);
    animation: capturePulse 0.45s ease;
    z-index: 2;
}

/* ==== Piece Styling ==== */
.piece {
    width: 50px; height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: bold;
    font-family: 'KaiTi', 'STKaiti', 'FangSong', 'STFangsong', 'SimSun', serif;
    user-select: none;
    cursor: pointer;
    background: var(--piece-bg);
    border: 2.5px solid var(--piece-border);
    box-shadow: var(--piece-shadow);
    transition: transform 0.12s ease, box-shadow 0.12s ease,
                background 0.4s, border-color 0.4s;
    z-index: 3;
    line-height: 1;
}

.piece:hover {
    transform: scale(1.1);
    box-shadow: var(--piece-hover-shadow);
}

.piece.red {
    color: var(--red-color);
    text-shadow: 0 1px 1px rgba(0,0,0,0.15);
}

.piece.black {
    color: var(--black-color);
    text-shadow: 0 1px 1px rgba(0,0,0,0.1);
}

.piece.selected {
    transform: scale(1.15);
    box-shadow: 0 0 0 3px var(--selected-glow),
                0 0 18px color-mix(in srgb, var(--selected-glow) 60%, transparent),
                2px 3px 6px rgba(0,0,0,0.3);
}

.piece.moved {
    animation: movePop 0.18s ease;
}

/* ==== Overlay ==== */
.overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.45);
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
}
.overlay.show { display: flex; }
.overlay span {
    color: var(--overlay-text);
    font-size: 26px;
    font-weight: bold;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
    animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
}

@keyframes movePop {
    0% { transform: scale(0.9); }
    60% { transform: scale(1.2); }
    100% { transform: scale(1); }
}

@keyframes capturePulse {
    0% { transform: scale(0.6); opacity: 0.2; }
    100% { transform: scale(1.2); opacity: 0; }
}

/* ==== Controls ==== */
.controls {
    margin-top: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
}

.win-counter {
    color: var(--overlay-text);
    font-size: 15px;
    font-weight: bold;
    padding: 6px 14px;
    border: 1.5px solid var(--btn-border);
    border-radius: 20px;
    letter-spacing: 1px;
    opacity: 0.9;
    transition: color 0.4s, border-color 0.4s;
}

#status {
    color: var(--status-color);
    font-size: 18px;
    min-width: 150px;
    text-align: center;
    transition: color 0.4s;
}

.btn {
    padding: 10px 22px;
    font-size: 15px;
    background: var(--btn-bg);
    color: var(--btn-color);
    border: 2px solid var(--btn-border);
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 2px;
    transition: background 0.2s, border-color 0.4s, color 0.4s;
}
.btn:hover { background: var(--btn-bg-hover); }

.difficulty-wrap {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border: 1.5px solid var(--btn-border);
    border-radius: 20px;
    color: var(--status-color);
    font-size: 14px;
    letter-spacing: 1px;
}

.difficulty-label {
    opacity: 0.85;
}

.difficulty-select {
    background: transparent;
    color: var(--status-color);
    border: none;
    outline: none;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
}

.difficulty-select option {
    color: #222;
}

.info-bar {
    margin-top: 10px;
    color: #8899aa;
    font-size: 13px;
}

/* ==== Skin Panel ==== */
.skin-backdrop {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: 90;
    animation: fadeIn 0.2s ease;
}
.skin-backdrop.show { display: block; }

.skin-panel {
    display: none;
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: linear-gradient(180deg, rgba(25,25,50,0.97), rgba(15,15,35,0.99));
    border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 28px 24px 24px;
    z-index: 100;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    min-width: 420px;
    opacity: 0;
    transition: transform 0.25s ease, opacity 0.25s ease;
}
.skin-panel.show {
    display: block;
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
}

.skin-panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}
.skin-panel-title {
    color: #fff;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 3px;
}
.skin-panel-close {
    color: #888;
    font-size: 26px;
    cursor: pointer;
    line-height: 1;
    padding: 0 4px;
    transition: color 0.2s;
}
.skin-panel-close:hover { color: #fff; }

.skin-cards {
    display: flex;
    gap: 14px;
}

/* ==== Puzzle Panel ==== */
.puzzle-backdrop {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.65);
    z-index: 90;
    animation: fadeIn 0.2s ease;
}
.puzzle-backdrop.show { display: block; }

.puzzle-panel {
    display: none;
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: linear-gradient(180deg, rgba(18,18,35,0.98), rgba(12,12,24,0.98));
    border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 24px 22px 20px;
    z-index: 100;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    min-width: 520px;
    opacity: 0;
    transition: transform 0.25s ease, opacity 0.25s ease;
}
.puzzle-panel.show {
    display: block;
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
}

.puzzle-panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}
.puzzle-panel-title {
    color: #fff;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 3px;
}
.puzzle-panel-close {
    color: #888;
    font-size: 26px;
    cursor: pointer;
    line-height: 1;
    padding: 0 4px;
    transition: color 0.2s;
}
.puzzle-panel-close:hover { color: #fff; }

.puzzle-list {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.puzzle-card {
    background: rgba(255,255,255,0.03);
    border: 1.5px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 12px 10px;
    text-align: left;
    transition: all 0.2s ease;
    cursor: pointer;
}
.puzzle-card:hover {
    border-color: rgba(255,255,255,0.25);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
}
.puzzle-card.locked {
    opacity: 0.5;
    cursor: not-allowed;
}
.puzzle-name {
    color: #f5f5f5;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 6px;
}
.puzzle-meta {
    color: #9aa3b2;
    font-size: 12px;
}
.puzzle-stars {
    color: #FFD700;
    font-size: 12px;
    margin-bottom: 6px;
}

.skin-card {
    flex: 1;
    padding: 14px 10px;
    border: 2px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    cursor: pointer;
    text-align: center;
    transition: all 0.25s ease;
    background: rgba(255,255,255,0.03);
    position: relative;
}
.skin-card:hover:not(.locked) {
    border-color: rgba(255,255,255,0.25);
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}
.skin-card.active {
    border-color: var(--selected-glow);
    box-shadow: 0 0 16px color-mix(in srgb, var(--selected-glow) 30%, transparent);
}
.skin-card.locked {
    opacity: 0.45;
    cursor: not-allowed;
}

.skin-preview {
    height: 56px;
    border-radius: 6px;
    margin-bottom: 10px;
    border: 1px solid rgba(255,255,255,0.1);
    position: relative;
    overflow: hidden;
}
/* Lines drawn in the preview via JS */
.skin-preview canvas { width: 100%; height: 100%; }

.skin-name {
    color: #eee;
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 4px;
}
.skin-desc {
    font-size: 12px;
    color: #999;
    margin-bottom: 6px;
}
.skin-status {
    font-size: 12px;
    font-weight: bold;
    padding: 3px 10px;
    border-radius: 10px;
    display: inline-block;
}
.skin-status.using {
    background: rgba(76,175,80,0.2);
    color: #66BB6A;
}
.skin-status.unlocked {
    background: rgba(100,100,255,0.1);
    color: #90CAF9;
}
.skin-status.need {
    background: rgba(255,255,255,0.05);
    color: #777;
}

/* ==== Unlock Toast ==== */
.unlock-toast {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.75);
    z-index: 200;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    cursor: pointer;
}
.unlock-toast.show {
    display: flex;
    animation: fadeIn 0.4s ease;
}

.unlock-content {
    text-align: center;
    animation: unlockBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.unlock-icon {
    font-size: 60px;
    color: #FFD700;
    text-shadow: 0 0 40px rgba(255,215,0,0.6);
    animation: spin 2s linear infinite;
    margin-bottom: 10px;
}
.unlock-content h2 {
    color: #FFD700;
    font-size: 32px;
    text-shadow: 0 0 30px rgba(255,215,0,0.5);
    margin-bottom: 12px;
    letter-spacing: 4px;
}
.unlock-content p {
    color: #fff;
    font-size: 20px;
    margin-bottom: 20px;
}
.unlock-hint {
    color: #888;
    font-size: 13px;
}

@keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
}
@keyframes unlockBounce {
    from { transform: scale(0.3); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
}
@keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
}

/* ==== Responsive ==== */
@media (max-width: 630px) {
    .board-container {
        transform: scale(calc((100vw - 40px) / 576));
        transform-origin: top center;
    }
    h1 { font-size: 24px; }
    .skin-panel { min-width: auto; width: 92vw; padding: 20px 14px; }
    .skin-cards { flex-direction: column; }
    .puzzle-panel { min-width: auto; width: 92vw; padding: 20px 14px; }
    .puzzle-list { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<div id="app">
    <h1>中 国 象 棋</h1>
    <div class="board-container">
        <svg id="board-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 640"></svg>
        <div id="pieces-grid"></div>
        <div id="overlay" class="overlay">
            <span>AI 思考中...</span>
        </div>
    </div>
    <div class="controls">
        <span class="win-counter" id="win-counter">胜: 0 局</span>
        <span id="status">红方回合</span>
        <span class="difficulty-wrap">
            <span class="difficulty-label">难度</span>
            <select id="difficulty-select" class="difficulty-select">
                <option value="easy">新手</option>
                <option value="normal">进阶</option>
                <option value="hard" selected>困难</option>
                <option value="master">大师</option>
            </select>
        </span>
        <button class="btn" id="btn-new">新 局</button>
        <button class="btn" id="btn-undo">悔 棋</button>
        <button class="btn" id="btn-puzzle">残 局</button>
        <button class="btn" id="btn-skin">皮 肤</button>
    </div>
    <div class="info-bar" id="info-bar"></div>
</div>

<!-- Puzzle Panel -->
<div id="puzzle-backdrop" class="puzzle-backdrop"></div>
<div id="puzzle-panel" class="puzzle-panel">
    <div class="puzzle-panel-header">
        <span class="puzzle-panel-title">残局挑战</span>
        <span class="puzzle-panel-close" id="puzzle-close">&times;</span>
    </div>
    <div class="puzzle-list" id="puzzle-list"></div>
</div>

<!-- Skin Selection Panel -->
<div id="skin-backdrop" class="skin-backdrop"></div>
<div id="skin-panel" class="skin-panel">
    <div class="skin-panel-header">
        <span class="skin-panel-title">选择棋盘皮肤</span>
        <span class="skin-panel-close" id="skin-close">&times;</span>
    </div>
    <div class="skin-cards" id="skin-cards"></div>
</div>

<!-- Unlock Notification -->
<div id="unlock-toast" class="unlock-toast">
    <div class="unlock-content">
        <div class="unlock-icon">&#9733;</div>
        <h2>新皮肤解锁！</h2>
        <p id="unlock-skin-name"></p>
        <span class="unlock-hint">点击任意处关闭</span>
    </div>
</div>

/* ================================================================
   Skin System State & Functions
   ================================================================ */
let currentSkinId = 'classic';
let wins = 0;
let currentDifficulty = 'hard';
let puzzleProgress = {};

function getSkin(id) {
    return SKINS.find(s => s.id === id) || SKINS[0];
}

function applySkin(skinId) {
    const skin = getSkin(skinId);
    /* Verify unlocked */
    if (skin.unlockWins > wins) {
        skinId = 'classic';
    }
    currentSkinId = skinId;
    const s = getSkin(currentSkinId);
    const root = document.documentElement.style;
    for (const [prop, val] of Object.entries(s.vars)) {
        root.setProperty(prop, val);
    }
    drawBoard();
    renderSkinCards();
}

function loadProfile() {
    try {
        const raw = localStorage.getItem('xiangqi_profile');
        if (raw) {
            const p = JSON.parse(raw);
            wins = p.wins || 0;
            currentSkinId = p.skin || 'classic';
            currentDifficulty = p.difficulty || 'hard';
            puzzleProgress = p.puzzleProgress || {};
        }
    } catch (e) { /* ignore */ }
    /* Safety: if saved skin is locked, fallback */
    const skin = getSkin(currentSkinId);
    if (skin.unlockWins > wins) currentSkinId = 'classic';
}

function saveProfile() {
    try {
        localStorage.setItem('xiangqi_profile', JSON.stringify({
            wins: wins,
            skin: currentSkinId,
            difficulty: currentDifficulty,
            puzzleProgress: puzzleProgress,
        }));
    } catch (e) { /* ignore */ }
}

function updateWinCounter() {
    document.getElementById('win-counter').textContent = '胜: ' + wins + ' 局';
}

function checkUnlock() {
    /* Find newly unlocked skins */
    for (const skin of SKINS) {
        if (skin.unlockWins > 0 && skin.unlockWins === wins) {
            showUnlockToast(skin);
            return;
        }
    }
}

function showUnlockToast(skin) {
    document.getElementById('unlock-skin-name').textContent =
        '「' + skin.name + '」 已解锁！';
    const toast = document.getElementById('unlock-toast');
    toast.classList.add('show');
    const dismiss = () => { toast.classList.remove('show'); toast.removeEventListener('click', dismiss); };
    toast.addEventListener('click', dismiss);
    setTimeout(dismiss, 4000);
}

/* ==== Skin Panel ==== */
function openSkinPanel() {
    renderSkinCards();
    document.getElementById('skin-backdrop').classList.add('show');
    /* Small delay for CSS transition */
    requestAnimationFrame(() => {
        document.getElementById('skin-panel').classList.add('show');
    });
}

function closeSkinPanel() {
    document.getElementById('skin-panel').classList.remove('show');
    document.getElementById('skin-backdrop').classList.remove('show');
}

function renderSkinCards() {
    const container = document.getElementById('skin-cards');
    if (!container) return;
    container.innerHTML = '';

    for (const skin of SKINS) {
        const card = document.createElement('div');
        const isUnlocked = wins >= skin.unlockWins;
        const isActive = currentSkinId === skin.id;

        card.className = 'skin-card';
        if (isActive) card.classList.add('active');
        if (!isUnlocked) card.classList.add('locked');

        /* Preview */
        const preview = document.createElement('div');
        preview.className = 'skin-preview';
        preview.style.background = skin.preview.board;

        /* Draw mini grid lines on preview */
        const cvs = document.createElement('canvas');
        cvs.width = 140; cvs.height = 56;
        const ctx = cvs.getContext('2d');
        ctx.strokeStyle = skin.preview.line;
        ctx.lineWidth = 1;
        for (let i = 0; i < 5; i++) {
            ctx.beginPath();
            ctx.moveTo(0, 8 + i * 10); ctx.lineTo(140, 8 + i * 10);
            ctx.stroke();
        }
        for (let i = 0; i < 9; i++) {
            ctx.beginPath();
            ctx.moveTo(10 + i * 15, 8); ctx.lineTo(10 + i * 15, 48);
            ctx.stroke();
        }
        preview.appendChild(cvs);
        card.appendChild(preview);

        /* Name */
        const nameEl = document.createElement('div');
        nameEl.className = 'skin-name';
        nameEl.textContent = skin.name;
        card.appendChild(nameEl);

        /* Description */
        const descEl = document.createElement('div');
        descEl.className = 'skin-desc';
        descEl.textContent = skin.desc;
        card.appendChild(descEl);

        /* Status badge */
        const statusEl = document.createElement('span');
        statusEl.className = 'skin-status';
        if (isActive) {
            statusEl.classList.add('using');
            statusEl.textContent = '使用中';
        } else if (isUnlocked) {
            statusEl.classList.add('unlocked');
            statusEl.textContent = '点击使用';
        } else {
            statusEl.classList.add('need');
            const need = skin.unlockWins - wins;
            statusEl.textContent = '再赢 ' + need + ' 局解锁';
        }
        card.appendChild(statusEl);

        /* Click handler */
        if (isUnlocked && !isActive) {
            card.addEventListener('click', () => {
                applySkin(skin.id);
                saveProfile();
                renderPieces();
            });
        }

        container.appendChild(card);
    }
}

/* ==== Puzzle Panel ==== */
function openPuzzlePanel() {
    renderPuzzleList();
    document.getElementById('puzzle-backdrop').classList.add('show');
    requestAnimationFrame(() => {
        document.getElementById('puzzle-panel').classList.add('show');
    });
}

function closePuzzlePanel() {
    document.getElementById('puzzle-panel').classList.remove('show');
    document.getElementById('puzzle-backdrop').classList.remove('show');
}

function renderPuzzleList() {
    const list = document.getElementById('puzzle-list');
    if (!list) return;
    list.innerHTML = '';
    for (let i = 0; i < PUZZLES.length; i++) {
        const p = PUZZLES[i];
        const card = document.createElement('div');
        card.className = 'puzzle-card';
        const progress = puzzleProgress[p.id];
        const prevId = i > 0 ? PUZZLES[i - 1].id : null;
        const unlocked = i === 0 || (prevId && puzzleProgress[prevId] && puzzleProgress[prevId].cleared);
        if (!unlocked) card.classList.add('locked');

        const name = document.createElement('div');
        name.className = 'puzzle-name';
        name.textContent = p.name;

        const stars = document.createElement('div');
        stars.className = 'puzzle-stars';
        stars.textContent = '★'.repeat(p.stars);

        const meta = document.createElement('div');
        meta.className = 'puzzle-meta';
        meta.textContent = '限步: ' + p.maxMoves + ' 步';

        const hint = document.createElement('div');
        hint.className = 'puzzle-meta';
        hint.textContent = '提示: ' + (p.hint || '暂无');

        const status = document.createElement('div');
        status.className = 'puzzle-meta';
        if (progress && progress.cleared) {
            status.textContent = '已通关 · 最佳 ' + (progress.bestMoves || '-') + ' 步';
        } else {
            status.textContent = '未通关';
        }

        card.appendChild(stars);
        card.appendChild(name);
        card.appendChild(meta);
        card.appendChild(hint);
        card.appendChild(status);

        if (unlocked) {
            card.addEventListener('click', () => {
                startPuzzle(p);
                closePuzzlePanel();
            });
        }

        if (!unlocked) {
            status.textContent = '未解锁（需通关上一关）';
        }

        list.appendChild(card);
    }
}

function startPuzzle(puzzle) {
    puzzleActive = true;
    puzzleId = puzzle.id;
    puzzleMoves = 0;
    puzzleMaxMoves = puzzle.maxMoves;
    puzzleSide = puzzle.side || 'r';
    document.getElementById('info-bar').textContent = '提示: ' + (puzzle.hint || '暂无');
    board = puzzle.board.map(row => [...row]);
    selectedPos = null;
    validMoves = [];
    currentTurn = puzzleSide;
    gameOver = false;
    lastMove = null;
    lastCapture = null;
    lastCapturedPiece = null;
    history = [];
    showOverlay(false);
    updatePuzzleStatus();
    renderPieces();
}

function updatePuzzleStatus() {
    const remain = Math.max(0, puzzleMaxMoves - puzzleMoves);
    setStatus('残局挑战（剩余 ' + remain + ' 步）');
    if (!document.getElementById('info-bar').textContent.startsWith('提示')) {
        document.getElementById('info-bar').textContent =
            '残局模式 · 已用 ' + puzzleMoves + ' / ' + puzzleMaxMoves + ' 步';
    }
}

function markPuzzleCleared(id, movesUsed) {
    const record = puzzleProgress[id];
    if (!record || !record.cleared || movesUsed < (record.bestMoves || Infinity)) {
        puzzleProgress[id] = { cleared: true, bestMoves: movesUsed };
        saveProfile();
    }
}

/* ================================================================
   Board Drawing (SVG) — reads skin colors
   ================================================================ */
function drawBoard() {
    const svg = document.getElementById('board-svg');
    svg.innerHTML = '';
    const ns = 'http://www.w3.org/2000/svg';
    const skin = getSkin(currentSkinId);
    const lineColor = skin.vars['--line-color'];
    const riverColor = skin.vars['--river-text'];

    function addLine(x1, y1, x2, y2, w) {
        const el = document.createElementNS(ns, 'line');
        el.setAttribute('x1', x1); el.setAttribute('y1', y1);
        el.setAttribute('x2', x2); el.setAttribute('y2', y2);
        el.setAttribute('stroke', lineColor);
        el.setAttribute('stroke-width', w || 1.5);
        svg.appendChild(el);
    }

    function addText(x, y, text, size) {
        const el = document.createElementNS(ns, 'text');
        el.setAttribute('x', x); el.setAttribute('y', y);
        el.setAttribute('text-anchor', 'middle');
        el.setAttribute('dominant-baseline', 'central');
        el.setAttribute('font-size', size || 26);
        el.setAttribute('fill', riverColor);
        el.setAttribute('font-family', 'KaiTi, STKaiti, FangSong, serif');
        el.setAttribute('opacity', '0.75');
        el.textContent = text;
        svg.appendChild(el);
    }

    /* Outer border */
    const bx = HALF - 4, by = HALF - 4;
    const bw = 8 * CS + 8, bh = 9 * CS + 8;
    const rect = document.createElementNS(ns, 'rect');
    rect.setAttribute('x', bx); rect.setAttribute('y', by);
    rect.setAttribute('width', bw); rect.setAttribute('height', bh);
    rect.setAttribute('fill', 'none');
    rect.setAttribute('stroke', lineColor);
    rect.setAttribute('stroke-width', 2.5);
    svg.appendChild(rect);

    /* Horizontal lines */
    for (let r = 0; r < 10; r++) {
        addLine(HALF, r * CS + HALF, 8 * CS + HALF, r * CS + HALF);
    }
    /* Vertical lines — top half */
    for (let c = 0; c < 9; c++) {
        addLine(c * CS + HALF, HALF, c * CS + HALF, 4 * CS + HALF);
    }
    /* Vertical lines — bottom half */
    for (let c = 0; c < 9; c++) {
        addLine(c * CS + HALF, 5 * CS + HALF, c * CS + HALF, 9 * CS + HALF);
    }
    /* Edge verticals across river */
    addLine(HALF, 4 * CS + HALF, HALF, 5 * CS + HALF);
    addLine(8 * CS + HALF, 4 * CS + HALF, 8 * CS + HALF, 5 * CS + HALF);

    /* Palace diagonals */
    addLine(3*CS+HALF, 0*CS+HALF, 5*CS+HALF, 2*CS+HALF);
    addLine(5*CS+HALF, 0*CS+HALF, 3*CS+HALF, 2*CS+HALF);
    addLine(3*CS+HALF, 7*CS+HALF, 5*CS+HALF, 9*CS+HALF);
    addLine(5*CS+HALF, 7*CS+HALF, 3*CS+HALF, 9*CS+HALF);

    /* Star marks */
    const stars = [
        [2,1],[2,7],[7,1],[7,7],
        [3,0],[3,2],[3,4],[3,6],[3,8],
        [6,0],[6,2],[6,4],[6,6],[6,8],
    ];
    const sd = 5, sl = 11;
    for (const [row, col] of stars) {
        const cx = col * CS + HALF, cy = row * CS + HALF;
        if (col < 8) {
            addLine(cx+sd, cy-sd, cx+sl, cy-sd, 1);
            addLine(cx+sd, cy-sd, cx+sd, cy-sl, 1);
            addLine(cx+sd, cy+sd, cx+sl, cy+sd, 1);
            addLine(cx+sd, cy+sd, cx+sd, cy+sl, 1);
        }
        if (col > 0) {
            addLine(cx-sd, cy-sd, cx-sl, cy-sd, 1);
            addLine(cx-sd, cy-sd, cx-sd, cy-sl, 1);
            addLine(cx-sd, cy+sd, cx-sl, cy+sd, 1);
            addLine(cx-sd, cy+sd, cx-sd, cy+sl, 1);
        }
    }

    /* River text */
    addText(2 * CS + HALF, 4.5 * CS + HALF, '楚  河', 30);
    addText(6 * CS + HALF, 4.5 * CS + HALF, '漢  界', 30);
}

/* ================================================================
   Rendering
   ================================================================ */
function renderPieces() {
    const grid = document.getElementById('pieces-grid');
    grid.innerHTML = '';

    for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 9; c++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.row = r;
            cell.dataset.col = c;
            cell.addEventListener('click', () => handleClick(r, c));

            if (lastMove) {
                if (r === lastMove.fr && c === lastMove.fc) cell.classList.add('last-from');
                if (r === lastMove.tr && c === lastMove.tc) cell.classList.add('last-to');
            }
            if (lastCapture && r === lastCapture.r && c === lastCapture.c) {
                cell.classList.add('capture');
            }

            const piece = board[r][c];
            const isValidTarget = validMoves.some(m => m[0] === r && m[1] === c);

            if (piece) {
                const div = document.createElement('div');
                div.className = 'piece ' + (piece[0] === 'r' ? 'red' : 'black');
                div.textContent = PIECE_CHAR[piece] || '?';

                if (selectedPos && selectedPos[0] === r && selectedPos[1] === c) {
                    div.classList.add('selected');
                }
                if (lastMove && lastMove.tr === r && lastMove.tc === c) {
                    div.classList.add('moved');
                }
                if (isValidTarget) {
                    cell.classList.add('valid-capture');
                }
                cell.appendChild(div);
            } else {
                if (isValidTarget) {
                    cell.classList.add('valid-move');
                }
            }

            grid.appendChild(cell);
        }
    }
}

/* ================================================================
   Move Generation (Client-Side)
   ================================================================ */
const MA_DELTAS = [
    [-1, 0, -2, -1], [-1, 0, -2, 1],
    [1, 0, 2, -1], [1, 0, 2, 1],
    [0, -1, -1, -2], [0, -1, 1, -2],
    [0, 1, -1, 2], [0, 1, 1, 2],
];
const ORTHO_DIRS = [[-1,0],[1,0],[0,-1],[0,1]];
const DIAG_DIRS = [[-1,-1],[-1,1],[1,-1],[1,1]];

function inBoard(r, c) { return r >= 0 && r < 10 && c >= 0 && c < 9; }

function getRawMoves(b, r, c) {
    const p = b[r][c];
    if (!p) return [];
    const color = p[0], type = p.substring(2);
    const moves = [];
    switch (type) {
        case 'che':   _genChe(b, r, c, color, moves); break;
        case 'pao':   _genPao(b, r, c, color, moves); break;
        case 'ma':    _genMa(b, r, c, color, moves); break;
        case 'xiang': _genXiang(b, r, c, color, moves); break;
        case 'shi':   _genShi(b, r, c, color, moves); break;
        case 'jiang': case 'shuai': _genKing(b, r, c, color, moves); break;
        case 'zu': case 'bing':     _genBing(b, r, c, color, moves); break;
    }
    return moves;
}

function _genChe(b, r, c, color, moves) {
    for (const [dr, dc] of ORTHO_DIRS) {
        let nr = r+dr, nc = c+dc;
        while (inBoard(nr, nc)) {
            const t = b[nr][nc];
            if (!t) { moves.push([nr, nc]); }
            else { if (t[0] !== color) moves.push([nr, nc]); break; }
            nr += dr; nc += dc;
        }
    }
}

function _genPao(b, r, c, color, moves) {
    for (const [dr, dc] of ORTHO_DIRS) {
        let nr = r+dr, nc = c+dc;
        while (inBoard(nr, nc)) {
            if (!b[nr][nc]) { moves.push([nr, nc]); }
            else {
                nr += dr; nc += dc;
                while (inBoard(nr, nc)) {
                    const t = b[nr][nc];
                    if (t) { if (t[0] !== color) moves.push([nr, nc]); break; }
                    nr += dr; nc += dc;
                }
                break;
            }
            nr += dr; nc += dc;
        }
    }
}

function _genMa(b, r, c, color, moves) {
    for (const [ldr, ldc, ddr, ddc] of MA_DELTAS) {
        const lr = r+ldr, lc = c+ldc;
        if (!inBoard(lr, lc) || b[lr][lc]) continue;
        const nr = r+ddr, nc = c+ddc;
        if (inBoard(nr, nc)) {
            const t = b[nr][nc];
            if (!t || t[0] !== color) moves.push([nr, nc]);
        }
    }
}

function _genXiang(b, r, c, color, moves) {
    for (const [dr, dc] of DIAG_DIRS) {
        const nr = r+2*dr, nc = c+2*dc;
        if (!inBoard(nr, nc)) continue;
        if (color === 'b' && nr > 4) continue;
        if (color === 'r' && nr < 5) continue;
        if (b[r+dr][c+dc]) continue;
        const t = b[nr][nc];
        if (!t || t[0] !== color) moves.push([nr, nc]);
    }
}

function _genShi(b, r, c, color, moves) {
    for (const [dr, dc] of DIAG_DIRS) {
        const nr = r+dr, nc = c+dc;
        if (nc < 3 || nc > 5) continue;
        if (color === 'b' && (nr < 0 || nr > 2)) continue;
        if (color === 'r' && (nr < 7 || nr > 9)) continue;
        const t = b[nr][nc];
        if (!t || t[0] !== color) moves.push([nr, nc]);
    }
}

function _genKing(b, r, c, color, moves) {
    for (const [dr, dc] of ORTHO_DIRS) {
        const nr = r+dr, nc = c+dc;
        if (nc < 3 || nc > 5) continue;
        if (color === 'b' && (nr < 0 || nr > 2)) continue;
        if (color === 'r' && (nr < 7 || nr > 9)) continue;
        const t = b[nr][nc];
        if (!t || t[0] !== color) moves.push([nr, nc]);
    }
    const targetKing = color === 'b' ? 'r_shuai' : 'b_jiang';
    const step = color === 'b' ? 1 : -1;
    let nr = r + step;
    while (nr >= 0 && nr < 10) {
        const t = b[nr][c];
        if (t) { if (t === targetKing) moves.push([nr, c]); break; }
        nr += step;
    }
}

function _genBing(b, r, c, color, moves) {
    if (color === 'b') {
        if (r+1 < 10 && (!b[r+1][c] || b[r+1][c][0] !== color)) moves.push([r+1, c]);
        if (r >= 5) {
            if (c-1 >= 0 && (!b[r][c-1] || b[r][c-1][0] !== color)) moves.push([r, c-1]);
            if (c+1 <  9 && (!b[r][c+1] || b[r][c+1][0] !== color)) moves.push([r, c+1]);
        }
    } else {
        if (r-1 >= 0 && (!b[r-1][c] || b[r-1][c][0] !== color)) moves.push([r-1, c]);
        if (r <= 4) {
            if (c-1 >= 0 && (!b[r][c-1] || b[r][c-1][0] !== color)) moves.push([r, c-1]);
            if (c+1 <  9 && (!b[r][c+1] || b[r][c+1][0] !== color)) moves.push([r, c+1]);
        }
    }
}

/* ================================================================
   Legal Move Filtering
   ================================================================ */
function isInCheck(b, color) {
    const kingName = color === 'r' ? 'r_shuai' : 'b_jiang';
    let kr = -1, kc = -1;
    for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 9; c++) {
            if (b[r][c] === kingName) { kr = r; kc = c; }
        }
    }
    if (kr < 0) return true;

    const enemy = color === 'r' ? 'b' : 'r';
    for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 9; c++) {
            if (b[r][c] && b[r][c][0] === enemy) {
                const targets = getRawMoves(b, r, c);
                for (const [tr, tc] of targets) {
                    if (tr === kr && tc === kc) return true;
                }
            }
        }
    }
    return false;
}

function getLegalMoves(b, r, c) {
    const raw = getRawMoves(b, r, c);
    const color = b[r][c][0];
    const legal = [];
    for (const [tr, tc] of raw) {
        const saved = b[tr][tc];
        const piece = b[r][c];
        b[tr][tc] = piece;
        b[r][c] = null;
        if (!isInCheck(b, color)) legal.push([tr, tc]);
        b[r][c] = piece;
        b[tr][tc] = saved;
    }
    return legal;
}

function hasAnyLegalMove(b, color) {
    for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 9; c++) {
            if (b[r][c] && b[r][c][0] === color) {
                if (getLegalMoves(b, r, c).length > 0) return true;
            }
        }
    }
    return false;
}

/* ================================================================
   Click Handler
   ================================================================ */
function handleClick(r, c) {
    if (gameOver) return;
    if (puzzleActive && currentTurn !== puzzleSide) return;
    if (!puzzleActive && currentTurn !== 'r') return;
    const piece = board[r][c];

    if (selectedPos) {
        if (validMoves.some(m => m[0] === r && m[1] === c)) {
            const [fr, fc] = selectedPos;
            saveHistory();
            doMove(fr, fc, r, c);
            selectedPos = null;
            validMoves = [];
            renderPieces();

            if (!gameOver) {
                if (puzzleActive) {
                    afterPuzzleMove();
                    return;
                }
                currentTurn = 'b';
                setStatus('AI 思考中...');
                showOverlay(true);
                setTimeout(requestAIMove, 50);
            }
            return;
        }
        if (piece && piece[0] === 'r') {
            selectedPos = [r, c];
            validMoves = getLegalMoves(board, r, c);
            renderPieces();
            return;
        }
        selectedPos = null;
        validMoves = [];
        renderPieces();
        return;
    }

    if (piece && piece[0] === currentTurn) {
        selectedPos = [r, c];
        validMoves = getLegalMoves(board, r, c);
        renderPieces();
    }
}

/* ================================================================
   Move Execution (with win tracking)
   ================================================================ */
function doMove(fr, fc, tr, tc) {
    const captured = board[tr][tc];
    board[tr][tc] = board[fr][fc];
    board[fr][fc] = null;
    lastMove = { fr, fc, tr, tc };
    lastCapture = captured ? { r: tr, c: tc } : null;
    lastCapturedPiece = captured || null;

    if (captured) {
        if (captured === 'b_jiang') {
            gameOver = true;
            setStatus('红方胜利！');
            showOverlay(false);
            if (!puzzleActive) {
                /* --- Win tracking --- */
                wins++;
                updateWinCounter();
                saveProfile();
                checkUnlock();
            }
        } else if (captured === 'r_shuai') {
            gameOver = true;
            setStatus('黑方胜利！');
            showOverlay(false);
        }
    }
}

function afterPuzzleMove() {
    puzzleMoves += 1;
    const targetKing = puzzleSide === 'r' ? 'b_jiang' : 'r_shuai';

    if (gameOver && lastCapturedPiece === targetKing) {
            setStatus('残局成功！');
            document.getElementById('info-bar').textContent = '通关完成';
            markPuzzleCleared(puzzleId, puzzleMoves);
            renderPuzzleList();
            const next = getNextPuzzle(puzzleId);
            if (next) {
                setTimeout(() => {
                    const goNext = window.confirm('通关成功！是否进入下一关？');
                    if (goNext) {
                        startPuzzle(next);
                    } else {
                        openPuzzlePanel();
                    }
                }, 50);
            } else {
                setTimeout(() => openPuzzlePanel(), 50);
            }
            return;
    }

    if (puzzleMoves >= puzzleMaxMoves) {
        gameOver = true;
        setStatus('挑战失败（超出步数）');
        document.getElementById('info-bar').textContent = '请重试';
        return;
    }

    updatePuzzleStatus();
}

function getNextPuzzle(id) {
    const idx = PUZZLES.findIndex(p => p.id === id);
    if (idx < 0 || idx >= PUZZLES.length - 1) return null;
    const next = PUZZLES[idx + 1];
    const prevId = PUZZLES[idx].id;
    if (puzzleProgress[prevId] && puzzleProgress[prevId].cleared) {
        return next;
    }
    return null;
}

function saveHistory() {
    history.push({
        board: board.map(row => [...row]),
        lastMove: lastMove ? { ...lastMove } : null,
        turn: currentTurn,
        puzzleActive: puzzleActive,
        puzzleId: puzzleId,
        puzzleMoves: puzzleMoves,
        puzzleMaxMoves: puzzleMaxMoves,
        puzzleSide: puzzleSide,
    });
}

/* ================================================================
   AI Communication
   ================================================================ */
async function requestAIMove() {
    try {
        const diff = getDifficulty(currentDifficulty);
        const res = await fetch('/ai-move', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ board, depth: diff.depth }),
        });
        const data = await res.json();
        showOverlay(false);

        if (data.status === 'ok' && data.move) {
            const { from, to } = data.move;
            saveHistory();
            doMove(from[0], from[1], to[0], to[1]);
            renderPieces();

            const info = '难度: ' + diff.name + ' | AI: ' + (data.nodes || '?') + ' 节点, ' + (data.time || '?') + 's';
            document.getElementById('info-bar').textContent = info;

            if (!gameOver) {
                currentTurn = 'r';
                if (!hasAnyLegalMove(board, 'r')) {
                    gameOver = true;
                    setStatus('黑方胜利！（绝杀）');
                } else if (isInCheck(board, 'r')) {
                    setStatus('将军！ 红方回合');
                } else {
                    setStatus('红方回合');
                }
            }
        } else {
            gameOver = true;
            setStatus('红方胜利！（AI无子可走）');
            wins++;
            updateWinCounter();
            saveProfile();
            checkUnlock();
        }
    } catch (err) {
        showOverlay(false);
        currentTurn = 'r';
        setStatus('网络错误，请重试');
        console.error('AI request failed:', err);
    }
}

/* ================================================================
   UI Helpers
   ================================================================ */
function setStatus(text) {
    document.getElementById('status').textContent = text;
}

function showOverlay(show) {
    const el = document.getElementById('overlay');
    if (show) el.classList.add('show');
    else el.classList.remove('show');
}

function undoMove() {
    if (puzzleActive) {
        setStatus('残局模式不支持悔棋');
        document.getElementById('info-bar').textContent = '请重新挑战该关卡';
        return;
    }
    if (history.length < 2 || gameOver) return;
    history.pop();
    const prev = history.pop();
    board = prev.board;
    lastMove = prev.lastMove;
    lastCapture = null;
    lastCapturedPiece = null;
    currentTurn = prev.turn || 'r';
    puzzleActive = prev.puzzleActive || false;
    puzzleId = prev.puzzleId || null;
    puzzleMoves = prev.puzzleMoves || 0;
    puzzleMaxMoves = prev.puzzleMaxMoves || 0;
    puzzleSide = prev.puzzleSide || 'r';
    selectedPos = null;
    validMoves = [];
    if (puzzleActive) {
        updatePuzzleStatus();
    } else {
        setStatus('红方回合');
        document.getElementById('info-bar').textContent = '';
    }
    renderPieces();
}

function newGame() {
    board = INITIAL_BOARD.map(row => [...row]);
    selectedPos = null;
    validMoves = [];
    currentTurn = 'r';
    gameOver = false;
    lastMove = null;
    lastCapture = null;
    lastCapturedPiece = null;
    history = [];
    puzzleActive = false;
    puzzleId = null;
    puzzleMoves = 0;
    puzzleMaxMoves = 0;
    puzzleSide = 'r';
    setStatus('红方回合');
    showOverlay(false);
    document.getElementById('info-bar').textContent = '';
    renderPieces();
}

/* ================================================================
   Init
   ================================================================ */
function init() {
    loadProfile();
    applySkin(currentSkinId);
    updateWinCounter();
    newGame();

    document.getElementById('btn-new').addEventListener('click', newGame);
    document.getElementById('btn-undo').addEventListener('click', undoMove);
    document.getElementById('btn-puzzle').addEventListener('click', openPuzzlePanel);
    document.getElementById('btn-skin').addEventListener('click', openSkinPanel);
    document.getElementById('skin-close').addEventListener('click', closeSkinPanel);
    document.getElementById('skin-backdrop').addEventListener('click', closeSkinPanel);
    document.getElementById('puzzle-close').addEventListener('click', closePuzzlePanel);
    document.getElementById('puzzle-backdrop').addEventListener('click', closePuzzlePanel);

    const diffSelect = document.getElementById('difficulty-select');
    diffSelect.value = currentDifficulty;
    diffSelect.addEventListener('change', () => {
        currentDifficulty = diffSelect.value;
        saveProfile();
    });
}

window.addEventListener('DOMContentLoaded', init);
</script>
