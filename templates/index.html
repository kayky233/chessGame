<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国象棋</title>
<style>
/* ============================================================
   CSS Custom Properties (Classic skin defaults)
   ============================================================ */
:root {
    --body-bg: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    --board-bg: #DEB887;
    --board-border: #5D3A1A;
    --board-outline: #3E2310;
    --board-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 0 30px rgba(93,58,26,0.15);
    --line-color: #5D3A1A;
    --river-text: #7B5B3A;
    --piece-bg: radial-gradient(circle at 38% 30%, #FFF8E7, #DEB887 55%, #B8860B 100%);
    --piece-border: #8B6914;
    --piece-shadow: 2px 3px 6px rgba(0,0,0,0.35), inset 0 1px 3px rgba(255,255,255,0.35);
    --piece-hover-shadow: 3px 4px 10px rgba(0,0,0,0.45), inset 0 1px 3px rgba(255,255,255,0.35);
    --red-color: #C41E3A;
    --black-color: #1A1A1A;
    --selected-glow: #FFD700;
    --title-color: #e6d5a8;
    --status-color: #e6d5a8;
    --btn-bg: linear-gradient(180deg, #A0522D, #8B4513);
    --btn-bg-hover: linear-gradient(180deg, #B5623A, #A0522D);
    --btn-border: #D2691E;
    --btn-color: #FFF8E7;
    --overlay-text: #FFD700;
    /* Character theme colors (set by JS) */
    --char-accent: #FFD700;
    --char-glow: rgba(255,215,0,0.15);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

/* ============================================================
   CINEMA MODE — Fixed Aspect Ratio + Letterbox
   Like watching a movie: if the screen doesn't match the ratio,
   black bars appear on the edges. Content NEVER distorts.
   ============================================================ */

/* ---- Body: pure black backdrop, flex-centers the stage ---- */
body {
    width: 100vw;
    height: 100vh;
    height: 100dvh;           /* dvh: fixes iOS/WeChat bottom bar overlap */
    margin: 0;
    overflow: hidden;          /* No scrollbars */
    background: #000;          /* Black letterbox color */
    font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;       /* Stage is always centered in the viewport */
}

/* No pseudo-element backgrounds on body — they now live on #game-stage */

/* ---- #app: pass-through wrapper ---- */
#app {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
}

/* ============================================================
   #game-stage — THE fixed-ratio cinema stage (核心中的核心)

   PC: locks to 16:9.  Mobile portrait: switches to 9:16.
   Uses a clever min/max trick to be as large as possible
   while never overflowing the viewport in either axis.

   All child elements use position:absolute with PERCENTAGES,
   so they will never drift or overflow — the layout is "dead".
   ============================================================ */
#game-stage {
    position: relative;

    /* ---- 16:9 Cinema Ratio (PC default) ---- */
    aspect-ratio: 16 / 9;

    /* Core sizing algorithm:
       width tries 100vw, but caps at what 100vh allows for 16:9.
       height tries 100vw*9/16, but caps at 100vh.
       Result: stage fills the screen as much as possible without overflow. */
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));

    overflow: hidden;          /* Clip anything outside the stage */
    box-shadow: 0 0 60px rgba(0,0,0,0.8); /* Subtle glow separating stage from black bars */
}

/* Atmospheric gradient background — now inside the stage, not body */
#game-stage::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--body-bg);
    z-index: 0;
    transition: background 1s ease;
}

/* Vignette overlay for cinematic depth */
#game-stage::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 60% 50%, transparent 40%, rgba(0,0,0,0.5) 100%);
    z-index: 0;
    pointer-events: none;
}

/* ============================================================
   Layer 1 — Character Sprite (left side, breaks the frame)
   Uses percentage of stage height so it scales with the stage.
   ============================================================ */
.char-panel {
    position: absolute;
    bottom: 0;
    left: 2%;                  /* Fixed position within the stage */
    height: 100%;              /* Fill stage height — "breaks the frame" feel */
    width: auto;
    max-width: 48%;            /* Never cover more than half the stage */
    z-index: 10;
    pointer-events: none;
    transition: opacity 0.4s ease;
}
.char-panel.hidden { display: none; }

/* Portrait fills the panel */
.char-portrait-area {
    width: auto;
    height: 100%;
    position: relative;
    pointer-events: none;
}
.char-portrait-svg {
    height: 100%;
    width: auto;
    filter: drop-shadow(8px 0 25px rgba(0,0,0,0.6));
}

/* Live2D canvas */
.l2d-canvas-wrap {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

/* Name / Stars — float within the char-panel */
.char-name-tag {
    position: absolute;
    bottom: 17%;               /* Percentage of char-panel height */
    left: 30px;
    font-size: 20px;
    font-weight: bold;
    color: #fff;
    letter-spacing: 4px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.9), 0 0 40px var(--char-glow);
    z-index: 15;
    pointer-events: none;
    white-space: nowrap;
}
.char-stars-tag {
    position: absolute;
    bottom: 14%;
    left: 32px;
    font-size: 14px;
    color: #FFD700;
    z-index: 15;
    pointer-events: none;
    text-shadow: 0 0 10px rgba(255,215,0,0.6);
}

/* ============================================================
   Dialogue Panel — Visual Novel style, absolute within stage
   ============================================================ */
.dialogue-bubble {
    position: absolute;
    bottom: 3%;                /* Percentage of stage height */
    left: 22%;                 /* Leave room for the character sprite */
    right: 3%;
    min-height: 80px;
    max-height: 130px;
    background: linear-gradient(90deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.65) 100%);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-left: 3px solid var(--char-accent);
    border-radius: 0 14px 14px 0;
    padding: 16px 24px 14px 20px;
    z-index: 50;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    pointer-events: none;
}
.dialogue-bubble.show {
    opacity: 1;
    transform: translateY(0);
}
.bubble-name {
    font-size: 15px;
    font-weight: bold;
    color: var(--char-accent);
    margin-bottom: 6px;
    letter-spacing: 2px;
}
.bubble-text {
    font-size: 14px;
    color: #e8e8e8;
    line-height: 1.6;
    min-height: 20px;
}
.bubble-cursor {
    display: inline-block;
    width: 2px;
    height: 16px;
    background: var(--char-accent);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 0.8s step-end infinite;
}
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

/* ============================================================
   Layer 2 — Board + controls (right side of stage)
   transform: scale(var(--board-scale)) is set by JS resizeStage()
   so the board always fits perfectly inside the cinema stage.
   ============================================================ */
.game-panel {
    position: absolute;
    right: 5%;
    top: 50%;
    transform: translateY(-50%) scale(var(--board-scale, 0.85));
    transform-origin: right center;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* No character → center the board */
.game-panel.centered {
    right: auto;
    left: 50%;
    transform: translate(-50%, -50%) scale(var(--board-scale, 0.85));
    transform-origin: center center;
}

/* Online users badge */
.online-badge {
    position: absolute;
    top: 42px;
    left: 16px;
    z-index: 62;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid rgba(76, 175, 80, 0.35);
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: #87f59a;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.2px;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
}
.online-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4caf50;
    box-shadow: 0 0 8px rgba(76, 175, 80, 0.9);
    animation: onlinePulse 1.8s infinite;
}
@keyframes onlinePulse {
    0% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.8); }
    100% { opacity: 1; transform: scale(1); }
}

/* ============================================================
   Top-right toolbar — absolute within #game-stage
   ============================================================ */
.toolbar-top {
    position: absolute;
    top: 12px;
    right: 16px;
    z-index: 60;
    display: flex;
    gap: 8px;
    align-items: center;
}
.toolbar-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.12);
    color: #ccc;
    font-size: 17px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
}
.toolbar-btn:hover {
    background: rgba(255,255,255,0.12);
    color: #fff;
    border-color: rgba(255,255,255,0.3);
}
.toolbar-btn .label {
    display: none;
}

/* ============================================================
   Game action buttons — floating near board
   ============================================================ */
.game-actions {
    margin-top: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}

.action-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    border: 1.5px solid rgba(255,255,255,0.1);
    color: #ddd;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    font-family: inherit;
    letter-spacing: 1px;
}
.action-btn:hover {
    background: rgba(255,255,255,0.15);
    color: #fff;
    border-color: rgba(255,255,255,0.3);
    transform: scale(1.1);
}
#btn-puzzle-retry {
    display: none;
    width: auto;
    min-width: 74px;
    padding: 0 14px;
    border-radius: 18px;
    font-size: 13px;
}
#btn-puzzle-retry.show {
    display: flex;
}

/* Status + info */
.game-status {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 10px;
}
#status {
    color: #e6d5a8;
    font-size: 16px;
    min-width: 100px;
    text-align: center;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
}
.win-counter {
    color: #FFD700;
    font-size: 13px;
    font-weight: bold;
    padding: 4px 12px;
    border: 1px solid rgba(255,215,0,0.3);
    border-radius: 16px;
    letter-spacing: 1px;
    background: rgba(0,0,0,0.3);
}
.info-bar {
    margin-top: 8px;
    color: #8899aa;
    font-size: 12px;
    text-align: center;
}

/* Difficulty (only in free mode) */
.difficulty-wrap {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    color: #ccc;
    font-size: 13px;
    background: rgba(0,0,0,0.3);
}
.difficulty-label { opacity: 0.8; }
.difficulty-select {
    background: transparent;
    color: #e6d5a8;
    border: none;
    outline: none;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
}
.difficulty-select option { color: #222; }

/* Title — subtle top-left corner of the stage */
h1 {
    position: absolute;
    top: 12px;
    left: 20px;
    z-index: 60;
    color: rgba(230,213,168,0.55);
    font-size: 15px;
    letter-spacing: 4px;
    margin: 0;
    text-shadow: 0 1px 6px rgba(0,0,0,0.5);
    transition: color 0.4s;
}

/* ============================================================
   Character Select Panel (Modal) — kept but polished
   ============================================================ */
.char-select-backdrop {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    z-index: 90;
    animation: fadeIn 0.2s ease;
}
.char-select-backdrop.show { display: block; }

.char-select-panel {
    display: none;
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: linear-gradient(180deg, rgba(20,20,42,0.98), rgba(10,10,28,0.99));
    border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 18px;
    padding: 28px 28px 22px;
    z-index: 100;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    min-width: 580px;
    max-width: 680px;
    opacity: 0;
    transition: transform 0.3s ease, opacity 0.3s ease;
}
.char-select-panel.show {
    display: block;
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
}
.char-select-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}
.char-select-title {
    color: #fff;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 4px;
}
.char-select-close {
    color: #888;
    font-size: 28px;
    cursor: pointer;
    line-height: 1;
    padding: 0 4px;
    transition: color 0.2s;
}
.char-select-close:hover { color: #fff; }

.char-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    max-height: 70vh;
    overflow-y: auto;
    padding-right: 4px;
}
.char-card {
    width: 180px;
    padding: 16px 12px;
    border: 2px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    cursor: pointer;
    text-align: center;
    transition: all 0.25s ease;
    background: rgba(255,255,255,0.02);
    position: relative;
}
.char-card:hover {
    border-color: rgba(255,255,255,0.3);
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.35);
}
.char-card.active {
    border-color: var(--selected-glow);
    box-shadow: 0 0 20px rgba(255,215,0,0.15);
}
.char-card-portrait {
    width: 120px;
    height: 150px;
    margin: 0 auto 10px;
    border-radius: 10px;
    overflow: hidden;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
}
.char-card-portrait svg { width: 100%; height: 100%; }
.char-card-name { color: #f0e6d0; font-size: 17px; font-weight: bold; letter-spacing: 2px; margin-bottom: 4px; }
.char-card-stars { color: #FFD700; font-size: 13px; margin-bottom: 6px; }
.char-card-desc { color: #9aa3b2; font-size: 12px; line-height: 1.5; }
.char-card-btn {
    margin-top: 10px;
    padding: 6px 20px;
    font-size: 13px;
    background: var(--btn-bg);
    color: var(--btn-color);
    border: 1.5px solid var(--btn-border);
    border-radius: 16px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 1px;
    transition: background 0.2s;
}
.char-card-btn:hover { background: var(--btn-bg-hover); }

/* Legacy .btn class kept for modal buttons */
.btn {
    padding: 10px 22px;
    font-size: 15px;
    background: var(--btn-bg);
    color: var(--btn-color);
    border: 2px solid var(--btn-border);
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 2px;
    transition: background 0.2s, border-color 0.4s, color 0.4s;
}
.btn:hover { background: var(--btn-bg-hover); }

.board-container {
    position: relative;
    display: inline-block;
    width: 576px;
    height: 640px;
    border: 6px solid var(--board-border);
    border-radius: 6px;
    box-shadow: var(--board-shadow);
    background: var(--board-bg);
    outline: 3px solid var(--board-outline);
    outline-offset: 2px;
    transition: background 0.5s, border-color 0.5s, box-shadow 0.5s, outline-color 0.5s;
}

#board-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
}

#pieces-grid {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: grid;
    grid-template-columns: repeat(9, 64px);
    grid-template-rows: repeat(10, 64px);
}

.cell {
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    z-index: 1;
}

.cell.last-from { background: rgba(255, 200, 0, 0.22); }
.cell.last-to   { background: rgba(255, 200, 0, 0.32); }

.cell.valid-move::before {
    content: '';
    position: absolute;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: rgba(0, 160, 0, 0.5);
    box-shadow: 0 0 6px rgba(0, 160, 0, 0.4);
    z-index: 2;
}

.cell.valid-capture .piece {
    box-shadow: 0 0 0 3px rgba(220, 0, 0, 0.65),
                2px 3px 6px rgba(0,0,0,0.3),
                inset 0 1px 3px rgba(255,255,255,0.3);
}

.cell.capture::after {
    content: '';
    position: absolute;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(220, 0, 0, 0.18);
    box-shadow: 0 0 14px rgba(220, 0, 0, 0.6);
    animation: capturePulse 0.45s ease;
    z-index: 2;
}

/* ==== Piece Styling ==== */
.piece {
    width: 50px; height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: bold;
    font-family: 'KaiTi', 'STKaiti', 'FangSong', 'STFangsong', 'SimSun', serif;
    user-select: none;
    cursor: pointer;
    background: var(--piece-bg);
    border: 2.5px solid var(--piece-border);
    box-shadow: var(--piece-shadow);
    transition: transform 0.12s ease, box-shadow 0.12s ease,
                background 0.4s, border-color 0.4s;
    z-index: 3;
    line-height: 1;
}

.piece:hover {
    transform: scale(1.1);
    box-shadow: var(--piece-hover-shadow);
}

.piece.red {
    color: var(--red-color);
    text-shadow: 0 1px 1px rgba(0,0,0,0.15);
}

.piece.black {
    color: var(--black-color);
    text-shadow: 0 1px 1px rgba(0,0,0,0.1);
}

.piece.selected {
    transform: scale(1.15);
    box-shadow: 0 0 0 3px var(--selected-glow),
                0 0 18px color-mix(in srgb, var(--selected-glow) 60%, transparent),
                2px 3px 6px rgba(0,0,0,0.3);
}

.piece.moved {
    animation: movePop 0.18s ease;
}

/* ==== Overlay ==== */
.overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.45);
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
}
.overlay.show { display: flex; }
.overlay span {
    color: var(--overlay-text);
    font-size: 26px;
    font-weight: bold;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
    animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
}

@keyframes movePop {
    0% { transform: scale(0.9); }
    60% { transform: scale(1.2); }
    100% { transform: scale(1); }
}

@keyframes capturePulse {
    0% { transform: scale(0.6); opacity: 0.2; }
    100% { transform: scale(1.2); opacity: 0; }
}

/* (Old controls block removed — now using .game-actions + .toolbar-top) */

/* ==== Skin Panel ==== */
.skin-backdrop {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: 90;
    animation: fadeIn 0.2s ease;
}
.skin-backdrop.show { display: block; }

.skin-panel {
    display: none;
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: linear-gradient(180deg, rgba(25,25,50,0.97), rgba(15,15,35,0.99));
    border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 28px 24px 24px;
    z-index: 100;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    min-width: 420px;
    opacity: 0;
    transition: transform 0.25s ease, opacity 0.25s ease;
}
.skin-panel.show {
    display: block;
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
}

.skin-panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}
.skin-panel-title {
    color: #fff;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 3px;
}
.skin-panel-close {
    color: #888;
    font-size: 26px;
    cursor: pointer;
    line-height: 1;
    padding: 0 4px;
    transition: color 0.2s;
}
.skin-panel-close:hover { color: #fff; }

.skin-cards {
    display: flex;
    gap: 14px;
}

/* ==== Puzzle Panel ==== */
.puzzle-backdrop {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.65);
    z-index: 90;
    animation: fadeIn 0.2s ease;
}
.puzzle-backdrop.show { display: block; }

.puzzle-panel {
    display: none;
    position: fixed;

/* ==== Unlock Toast ==== */
.unlock-toast {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.75);
    z-index: 200;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    cursor: pointer;
}
.unlock-toast.show {
    display: flex;
    animation: fadeIn 0.4s ease;
}

.unlock-content {
    text-align: center;
    animation: unlockBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.unlock-icon {
    font-size: 60px;
    color: #FFD700;
    text-shadow: 0 0 40px rgba(255,215,0,0.6);
    animation: spin 2s linear infinite;
    margin-bottom: 10px;
}
.unlock-content h2 {
    color: #FFD700;
    font-size: 32px;
    text-shadow: 0 0 30px rgba(255,215,0,0.5);
    margin-bottom: 12px;
    letter-spacing: 4px;
}
.unlock-content p {
    color: #fff;
    font-size: 20px;
    margin-bottom: 20px;
}
.unlock-hint {
    color: #888;
    font-size: 13px;
}

@keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
}
@keyframes unlockBounce {
    from { transform: scale(0.3); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
}
@keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
}

/* ============================================================
   PORTRAIT MODE — Switch stage to 9:16 ratio
   Triggered when the screen is taller than it is wide.
   The stage rotates to vertical, layout stacks top-to-bottom.
   ============================================================ */
@media screen and (max-aspect-ratio: 1/1) {
    body {
        height: 100dvh;        /* dvh: fixes iOS Safari / WeChat bottom bar */
    }

    #game-stage {
        /* Switch to 9:16 vertical cinema ratio */
        aspect-ratio: 9 / 16;
        width: min(100vw, calc(100dvh * 9 / 16));
        height: min(100dvh, calc(100vw * 16 / 9));
    }

    /* --- Board: centered near the top, scale set by JS --- */
    .game-panel {
        top: 8%;
        right: auto;
        left: 50%;
        transform: translateX(-50%) scale(var(--board-scale, 0.6));
        transform-origin: top center;
    }
    .game-panel.centered {
        top: 8%;
        right: auto;
        left: 50%;
        transform: translateX(-50%) scale(var(--board-scale, 0.6));
        transform-origin: top center;
    }

    /* --- Character: translucent accent in the lower half --- */
    .char-panel {
        height: 50%;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        opacity: 0.75;
        z-index: 5;            /* Below the board */
        max-width: 90%;
    }
    .char-name-tag {
        bottom: 22%;
        left: auto;
        right: 8px;
        font-size: 16px;
    }
    .char-stars-tag {
        bottom: 18%;
        left: auto;
        right: 10px;
        font-size: 12px;
    }

    /* --- Dialogue: full width at the bottom --- */
    .dialogue-bubble {
        left: 3%;
        right: 3%;
        bottom: 1.5%;
        min-height: 50px;
        max-height: 90px;
        border-radius: 10px;
        padding: 10px 14px;
    }
    .bubble-name { font-size: 13px; margin-bottom: 4px; }
    .bubble-text { font-size: 13px; line-height: 1.4; }

    /* --- Toolbar --- */
    .toolbar-top { top: 6px; right: 8px; gap: 5px; }
    .toolbar-btn { width: 32px; height: 32px; font-size: 14px; }
    .online-badge { top: 40px; left: 8px; font-size: 11px; padding: 4px 10px; gap: 6px; }
    .online-dot { width: 7px; height: 7px; }

    /* --- Title --- */
    h1 { font-size: 12px; top: 8px; left: 10px; }

    /* --- Modals: full-width on mobile --- */
    .char-select-panel { min-width: auto; width: 94vw; padding: 18px 12px; }
    .char-cards { grid-template-columns: repeat(2, 1fr); }
    .char-card { width: auto; }
    .char-card-portrait { width: 80px; height: 100px; }
    .skin-panel { min-width: auto; width: 92vw; padding: 18px 12px; }
    .skin-cards { flex-direction: column; }
    .puzzle-panel { min-width: auto; width: 92vw; padding: 18px 12px; }
    .puzzle-list { grid-template-columns: repeat(2, 1fr); }
    .rank-panel { min-width: auto; width: 94vw; padding: 18px 12px; }
    .rank-auth-row { flex-wrap: wrap; }
    .rank-auth-pill { min-width: 100%; }
    .rank-profile-row { flex-wrap: wrap; }
    #player-name-input { min-width: 100%; }
    .rank-list { max-height: 44vh; }
    .auth-panel { width: 94vw; }
}

/* ============================================================
   Live2D Overrides
   When Live2D is on, the SVG is hidden. We must provide an
   explicit width for the panel so the canvas doesn't collapse.
   ============================================================ */
.l2d-canvas-wrap { display: none; overflow: hidden; }
.l2d-canvas-wrap canvas { width: 100% !important; height: 100% !important; }
.l2d-canvas-wrap.show { display: block; }

.char-panel.live2d-mode .char-portrait-svg { display: none; }
.char-panel.live2d-mode {
    width: 40%;                /* Percentage of stage width */
    max-width: 48%;
}
.char-panel.live2d-mode .char-portrait-area {
    width: 100%;
    height: 100%;
}
.char-panel.live2d-mode .l2d-canvas-wrap {
    position: relative;
    width: 100%;
    height: 100%;
}

/* Live2D in portrait mode */
@media screen and (max-aspect-ratio: 1/1) {
    .char-panel.live2d-mode {
        width: 70%;
        max-width: 90%;
    }
}

/* ============================================================
   Freemium — Locked Character Card State
   ============================================================ */
.char-card.locked {
    filter: grayscale(90%) brightness(0.7);
    opacity: 0.85;
    cursor: pointer;                /* still clickable — opens payment modal */
    position: relative;
    border-color: #444 !important;
    transition: filter 0.3s, opacity 0.3s;
}
.char-card.locked:hover {
    filter: grayscale(60%) brightness(0.85);
    opacity: 1;
}
/* Lock icon overlay — bundle pricing */
.char-card.locked::after {
    content: '\1F512  付费';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.85);
    color: #ffd700;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    border: 1px solid rgba(255,215,0,0.5);
    white-space: nowrap;
    z-index: 5;
    pointer-events: none;
}
/* Hide the "选择" button on locked cards */
.char-card.locked .char-card-btn {
    display: none;
}

   ============================================================ */
function openPaymentModal(charId) {
    pendingPayCharId = charId;
    const info = CHARACTER_INFO[charId];
    if (!info) return;
    // Render preview of the clicked character
    const previewSvg = document.getElementById('pay-char-preview');
    drawCharPortrait(previewSvg, charId, 'normal');
    // Title: emphasize "unlock ALL" from the clicked character
    document.getElementById('payment-title').textContent = '解锁全部付费角色';
    document.getElementById('pay-char-name').textContent = '解锁「' + info.name + '」及所有付费角色';
    // Reset input & hints
    document.getElementById('cd-key-input').value = '';
    document.getElementById('payment-hint').textContent = '';
    document.getElementById('payment-hint').className = 'payment-hint';
    // Show modal
    document.getElementById('payment-backdrop').classList.add('show');
    document.getElementById('payment-modal').classList.add('show');
}

function closePaymentModal() {
    document.getElementById('payment-backdrop').classList.remove('show');
    document.getElementById('payment-modal').classList.remove('show');
    pendingPayCharId = null;
}

function verifyCode() {
    const hint = document.getElementById('payment-hint');
    const inputEl = document.getElementById('cd-key-input');
    const input = inputEl.value.trim().toUpperCase();
    if (!input) {
        hint.textContent = '请输入激活码';
        hint.className = 'payment-hint';
        return;
    }

    // --- 👑 Admin God Mode (developer) ---
    if (input === ADMIN_KEY) {
        activateGodMode();
        return;
    }

    // --- 💰 Bundle Code: unlock ALL paid characters ---
    if (input === BUNDLE_CODE) {
        unlockAllPaid();
        return;
    }

    // --- Invalid ---
    hint.textContent = '激活码错误，请检查爱发电【感谢信】中的激活码';
    hint.className = 'payment-hint';
    inputEl.classList.add('shake-error');
    setTimeout(() => inputEl.classList.remove('shake-error'), 500);
}

function unlockAllPaid() {
    CHARACTER_IDS.forEach(id => unlockedChars.add(id));
    saveUnlocks();
    const hint = document.getElementById('payment-hint');
    hint.textContent = '🎉 激活成功！感谢支持，所有付费角色已解锁！';
    hint.className = 'payment-hint success';

        // Auto-select the character that triggered the modal
        if (pendingPayCharId) selectCharacter(pendingPayCharId);

/* ==== Character Select Panel Logic ==== */
let currentCharacterId = null; // null = no character, use difficulty mode

function openCharSelect() {
    document.getElementById('char-select-backdrop').classList.add('show');
    document.getElementById('char-select-panel').classList.add('show');
    renderCharCards();
}
function closeCharSelect() {
    document.getElementById('char-select-backdrop').classList.remove('show');
    document.getElementById('char-select-panel').classList.remove('show');
}

function renderCharCards() {
    const container = document.getElementById('char-cards');
    container.innerHTML = '';
    CHARACTER_IDS.forEach(id => {
        const info = CHARACTER_INFO[id];
        const isActive = currentCharacterId === id;
        const unlocked = isCharUnlocked(id);
        const maxStars = 5;
        const card = document.createElement('div');
        card.className = 'char-card'
            + (isActive ? ' active' : '')
            + (!unlocked ? ' locked' : '');
        card.innerHTML = `
            <div class="char-card-portrait"><svg viewBox="0 0 320 800"></svg></div>
            <div class="char-card-name">${info.name}</div>
            <div class="char-card-stars">${'★'.repeat(info.stars)}${'☆'.repeat(maxStars - info.stars)}</div>
            <div class="char-card-desc">${info.desc}</div>
            <button class="char-card-btn">${isActive ? '当前对手' : '选择'}</button>
        `;
        const svg = card.querySelector('svg');
        drawCharPortrait(svg, id, 'normal');
        if (unlocked) {
            card.querySelector('.char-card-btn').addEventListener('click', () => {
                selectCharacter(id);
            });
        } else {
            // Locked: clicking anywhere on the card opens payment modal
            card.addEventListener('click', () => {
                openPaymentModal(id);
            });
        }
        container.appendChild(card);
    });

    // Admin mode golden aura
    if (isAdmin) {
        document.body.classList.add('admin-mode');
    }
}

function selectCharacter(charId) {
    // Guard: if paid char is somehow not unlocked, open payment
    if (charId && !isCharUnlocked(charId)) {
        openPaymentModal(charId);
        return;
    }
    currentCharacterId = charId;
    if (charId) {
        currentDifficulty = charId;
    } else {
        // Restore difficulty from dropdown
        currentDifficulty = document.getElementById('difficulty-select').value || 'hard';
    }
    saveProfile();
    updateCharPanel();
    closeCharSelect();
    newGame();
}

function updateCharPanel() {
    const panel = document.getElementById('char-panel');
    const gamePanel = document.getElementById('game-panel');
    const diffWrap = document.getElementById('difficulty-wrap');
    if (currentCharacterId) {
        panel.classList.remove('hidden');
        gamePanel.classList.remove('centered');
        diffWrap.style.display = 'none';
        const info = CHARACTER_INFO[currentCharacterId];
        document.getElementById('char-name-tag').textContent = info.name;
        document.getElementById('char-stars-tag').textContent = '★'.repeat(info.stars) + '☆'.repeat(5 - info.stars);
        drawCharPortrait(document.getElementById('char-portrait-svg'), currentCharacterId, 'normal');
        // Set character theme
        const accent = info.colors.accent || '#FFD700';
        document.documentElement.style.setProperty('--char-accent', accent);
        document.documentElement.style.setProperty('--char-glow', accent + '33');
        if (info.bg) {
            document.documentElement.style.setProperty('--body-bg', info.bg);
        }
        // Live2D
        if (live2dEnabled) {
            loadLive2DModel(currentCharacterId);
        } else {
            hideLive2D();
        }
    } else {
        panel.classList.add('hidden');
        gamePanel.classList.add('centered');
        diffWrap.style.display = '';
        hideLive2D();
        // Reset background
        document.documentElement.style.setProperty('--body-bg',
            'linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)');
    }
}

/* ==== Live2D Integration ==== */
const L2D_MODEL_BASE = 'https://imuncle.github.io/live2d/live2d_3/model/';
const L2D_MODEL_MAP = {
    unicorn:  'Azue Lane(JP)/dujiaoshou_4',
    laffey:   'Azue Lane(JP)/lafei',
    shokaku:  'Azue Lane(JP)/xianghe_2',
    ibuki:    'Azue Lane(JP)/yichui_2',
    sirius:   'Azue Lane(JP)/tianlangxing_3',
    taihou:   'Azue Lane(JP)/dafeng_2',
};

let live2dEnabled = false;
let live2dReady = false;   // true once all SDK scripts are loaded
let l2dApp = null;        // PIXI.Application
let l2dInstance = null;    // L2D loader instance
let l2dCurrentModel = null; // current model reference
let l2dCurrentCharId = null;

/* ---- Dynamic Live2D SDK loader (non-blocking) ---- */
const L2D_SCRIPTS = [
    'https://imuncle.github.io/live2d/live2d_3/js/pixi.min.js',
    'https://imuncle.github.io/live2d/live2d_3/js/live2dcubismcore.min.js',
    'https://imuncle.github.io/live2d/live2d_3/js/live2dcubismframework.js',
    'https://imuncle.github.io/live2d/live2d_3/js/live2dcubismpixi.js',
];
let l2dScriptLoadPromise = null;

function loadLive2DScripts() {
    if (live2dReady) return Promise.resolve();
    if (l2dScriptLoadPromise) return l2dScriptLoadPromise;

    l2dScriptLoadPromise = new Promise((resolve, reject) => {
        let idx = 0;
        function loadNext() {
            if (idx >= L2D_SCRIPTS.length) {
                live2dReady = true;
                console.log('[Live2D] SDK loaded OK');
                resolve();
                return;
            }
            const s = document.createElement('script');
            s.src = L2D_SCRIPTS[idx];
            s.onload = () => { idx++; loadNext(); };
            s.onerror = () => {
                console.warn('[Live2D] Failed to load:', L2D_SCRIPTS[idx]);
                reject(new Error('Live2D script load failed: ' + L2D_SCRIPTS[idx]));
            };
            document.head.appendChild(s);
        }
        loadNext();
        // Timeout: 15 seconds
        setTimeout(() => {
            if (!live2dReady) {
                console.warn('[Live2D] Load timeout (15s)');
                reject(new Error('Live2D load timeout'));
            }
        }, 15000);
    });
    l2dScriptLoadPromise.catch(() => { l2dScriptLoadPromise = null; });
    return l2dScriptLoadPromise;
}

function initLive2D() {
    // Restore toggle state
    const saved = localStorage.getItem('chess_live2d');
    live2dEnabled = saved === 'true';
    const toggle = document.getElementById('live2d-toggle');
    if (toggle) {
        toggle.checked = live2dEnabled;
        toggle.addEventListener('change', () => {
            live2dEnabled = toggle.checked;
            localStorage.setItem('chess_live2d', live2dEnabled);
            updateCharPanel();
        });
    }
    // Pre-load scripts in background (don't block page)
    if (live2dEnabled) {
        loadLive2DScripts().catch(() => {});
    }
}

function createL2DApp() {
    if (l2dApp) return true;
    if (!live2dReady || typeof PIXI === 'undefined') return false;
    const wrap = document.getElementById('l2d-canvas-wrap');
    if (!wrap) return false;
    try {
        l2dApp = new PIXI.Application(840, 1600, { transparent: true });
        l2dApp.view.style.width = '100%';
        l2dApp.view.style.height = '100%';
        wrap.appendChild(l2dApp.view);

        l2dInstance = new L2DLoader(L2D_MODEL_BASE);

        l2dApp.ticker.add((dt) => {
            if (!l2dCurrentModel) return;
            l2dCurrentModel.update(dt);
            l2dCurrentModel.masks.update(l2dApp.renderer);
        });
        return true;
    } catch (e) {
        console.warn('Live2D init failed:', e);
        l2dApp = null;
        return false;
    }
}

// Simplified L2D loader (adapted from l2d.js)
class L2DLoader {
    constructor(basePath) {
        this.basePath = basePath;
        this.animatorBuilder = new LIVE2DCUBISMFRAMEWORK.AnimatorBuilder();
        this.timeScale = 1;
        this.models = {};
    }

    setPhysics3Json(value) {
        if (!this.physicsRigBuilder) {
            this.physicsRigBuilder = new LIVE2DCUBISMFRAMEWORK.PhysicsRigBuilder();
        }
        this.physicsRigBuilder.setPhysics3Json(value);
        return this;
    }

    load(name, callback) {
        if (this.models[name]) {
            callback(this.models[name]);
            return;
        }
        const loader = new PIXI.loaders.Loader(this.basePath);
        const modelDir = name + '/';
        const shortName = name.split('/').pop();
        const modelPath = shortName + '.model3.json';
        let textures = [];
        let textureCount = 0;
        let motionNames = [];

        loader.add(shortName + '_model', modelDir + modelPath, { xhrType: PIXI.loaders.Resource.XHR_RESPONSE_TYPE.JSON });
        loader.load((ldr, resources) => {
            const model3Obj = resources[shortName + '_model'].data;
            if (model3Obj['FileReferences']['Moc']) {
                ldr.add(shortName + '_moc', modelDir + model3Obj['FileReferences']['Moc'], { xhrType: PIXI.loaders.Resource.XHR_RESPONSE_TYPE.BUFFER });
            }
            if (model3Obj['FileReferences']['Textures']) {
                model3Obj['FileReferences']['Textures'].forEach(el => {
                    ldr.add(shortName + '_texture' + textureCount, modelDir + el);
                    textureCount++;
                });
            }
            if (model3Obj['FileReferences']['Physics']) {
                ldr.add(shortName + '_physics', modelDir + model3Obj['FileReferences']['Physics'], { xhrType: PIXI.loaders.Resource.XHR_RESPONSE_TYPE.JSON });
            }
            if (model3Obj['FileReferences']['Motions']) {
                for (let group in model3Obj['FileReferences']['Motions']) {
                    model3Obj['FileReferences']['Motions'][group].forEach(el => {
                        const motionName = el['File'].split('/').pop().split('.').shift();
                        ldr.add(shortName + '_' + motionName, modelDir + el['File'], { xhrType: PIXI.loaders.Resource.XHR_RESPONSE_TYPE.JSON });
                        motionNames.push(shortName + '_' + motionName);
                    });
                }
            }
            let groups = null;
            if (model3Obj['Groups']) {
                groups = LIVE2DCUBISMFRAMEWORK.Groups.fromModel3Json(model3Obj);
            }
            ldr.load((l2, r) => {
                let moc = null;
                if (r[shortName + '_moc']) {
                    moc = Live2DCubismCore.Moc.fromArrayBuffer(r[shortName + '_moc'].data);
                }
                for (let i = 0; i < textureCount; i++) {
                    if (r[shortName + '_texture' + i]) {
                        textures.push(r[shortName + '_texture' + i].texture);
                    }
                }
                if (r[shortName + '_physics']) {
                    this.setPhysics3Json(r[shortName + '_physics'].data);
                }
                let motions = new Map();
                motionNames.forEach(el => {
                    const n = el.split(shortName + '_').pop();
                    motions.set(n, LIVE2DCUBISMFRAMEWORK.Animation.fromMotion3Json(r[el].data));
                });
                const coreModel = Live2DCubismCore.Model.fromMoc(moc);
                if (!coreModel) return;
                const animator = this.animatorBuilder.setTarget(coreModel).setTimeScale(this.timeScale).build();
                let physicsRig = null;
                if (this.physicsRigBuilder) {
                    physicsRig = this.physicsRigBuilder.setTarget(coreModel).setTimeScale(this.timeScale).build();
                }
                const model = LIVE2DCUBISMPIXI.Model._create(coreModel, textures, animator, physicsRig, null, groups);
                model.motions = motions;
                this.models[name] = model;
                callback(model);
            });
        });
    }
}

function onL2DUpdate(delta) {
    const deltaTime = 0.016 * delta;
    if (!this.animator.isPlaying) {
        const m = this.motions.get('idle');
        if (m) this.animator.getLayer('base').play(m);
    }
    this._animator.updateAndEvaluate(deltaTime);
    if (this._physicsRig) {
        this._physicsRig.updateAndEvaluate(deltaTime);
    }
    this._coreModel.update();
    let sort = false;
    for (let m = 0; m < this._meshes.length; ++m) {
        this._meshes[m].alpha = this._coreModel.drawables.opacities[m];
        this._meshes[m].visible = Live2DCubismCore.Utils.hasIsVisibleBit(this._coreModel.drawables.dynamicFlags[m]);
        if (Live2DCubismCore.Utils.hasVertexPositionsDidChangeBit(this._coreModel.drawables.dynamicFlags[m])) {
            this._meshes[m].vertices = this._coreModel.drawables.vertexPositions[m];
            this._meshes[m].dirtyVertex = true;
        }
        if (Live2DCubismCore.Utils.hasRenderOrderDidChangeBit(this._coreModel.drawables.dynamicFlags[m])) {
            sort = true;
        }
    }
    if (sort) {
        this.children.sort((a, b) => {
            const aIdx = this._meshes.indexOf(a);
            const bIdx = this._meshes.indexOf(b);
            return this._coreModel.drawables.renderOrders[aIdx] - this._coreModel.drawables.renderOrders[bIdx];
        });
    }
    this._coreModel.drawables.resetDynamicFlags();
}

function loadLive2DModel(charId) {
    const modelPath = L2D_MODEL_MAP[charId];
    if (!modelPath) { hideLive2D(); return; }

    // Async: ensure SDK is loaded first
    loadLive2DScripts().then(() => {
        if (!createL2DApp()) { hideLive2D(); return; }
        if (!l2dApp || !l2dInstance) { hideLive2D(); return; }

        // Already showing this model?
        if (l2dCurrentCharId === charId && l2dCurrentModel) {
            showLive2D();
            return;
        }

        // Remove old model
        l2dApp.stage.removeChildren();
        l2dCurrentModel = null;

function showLive2D() {
    const panel = document.getElementById('char-panel');
    const wrap = document.getElementById('l2d-canvas-wrap');
    if (panel) panel.classList.add('live2d-mode');
    if (wrap) wrap.classList.add('show');

    const svg = document.getElementById('char-portrait-svg');
    if (svg) svg.style.display = 'none';
}

function hideLive2D() {
    const panel = document.getElementById('char-panel');
    const wrap = document.getElementById('l2d-canvas-wrap');
    if (panel) panel.classList.remove('live2d-mode');
    if (wrap) wrap.classList.remove('show');
    // Show SVG
    const svg = document.getElementById('char-portrait-svg');
    if (svg) svg.style.display = '';
}

/* ================================================================
   Skin System State & Functions
   ================================================================ */
let currentSkinId = 'classic';
let wins = 0;
let currentDifficulty = 'hard';
let puzzleProgress = {};
let playerName = '';
let authState = { loggedIn: false, user: null };
let authMode = 'login';
let matchReported = false;
let matchStartTs = 0;

function getSkin(id) {
    return SKINS.find(s => s.id === id) || SKINS[0];
}

function applySkin(skinId) {
    const skin = getSkin(skinId);
    /* Verify unlocked */
    if (skin.unlockWins > wins) {
        skinId = 'classic';
    }
    currentSkinId = skinId;
    const s = getSkin(currentSkinId);
    const root = document.documentElement.style;
    for (const [prop, val] of Object.entries(s.vars)) {
        root.setProperty(prop, val);
    }
    drawBoard();
    renderSkinCards();
}

function loadProfile() {
    try {
        const raw = localStorage.getItem('xiangqi_profile');
        if (raw) {
            const p = JSON.parse(raw);
            wins = p.wins || 0;
            currentSkinId = p.skin || 'classic';
            currentDifficulty = p.difficulty || 'hard';
            puzzleProgress = p.puzzleProgress || {};
            playerName = (p.playerName || '').trim().slice(0, 24);
            currentCharacterId = p.characterId || null;
            // Validate character ID still exists
            if (currentCharacterId && !CHARACTER_IDS.includes(currentCharacterId)) {
                currentCharacterId = null;
            }
            // Validate character is unlocked; if not, fallback to default
            if (currentCharacterId && !isCharUnlocked(currentCharacterId)) {
                currentCharacterId = 'ibuki'; // ibuki is always free
            }
            if (currentCharacterId) currentDifficulty = currentCharacterId;
        } else {
            // First visit: default to ibuki
            currentCharacterId = 'ibuki';
            currentDifficulty = 'ibuki';
        }
    } catch (e) {
        currentCharacterId = 'ibuki';
        currentDifficulty = 'ibuki';
    }
    /* Safety: if saved skin is locked, fallback */
    const skin = getSkin(currentSkinId);
    if (skin.unlockWins > wins) currentSkinId = 'classic';
}

function saveProfile() {
    try {
        localStorage.setItem('xiangqi_profile', JSON.stringify({
            wins: wins,
            skin: currentSkinId,
            difficulty: currentDifficulty,
            puzzleProgress: puzzleProgress,
            playerName: playerName,
            characterId: currentCharacterId,
        }));
    } catch (e) { /* ignore */ }
}

function updateWinCounter() {
    document.getElementById('win-counter').textContent = '胜: ' + wins + ' 局';
}

function checkUnlock() {
    /* Find newly unlocked skins */
    for (const skin of SKINS) {
        if (skin.unlockWins > 0 && skin.unlockWins === wins) {
            showUnlockToast(skin);
            return;
        }
    }
}

function showUnlockToast(skin) {
    document.getElementById('unlock-skin-name').textContent =
        '「' + skin.name + '」 已解锁！';
    const toast = document.getElementById('unlock-toast');
    toast.classList.add('show');
    const dismiss = () => { toast.classList.remove('show'); toast.removeEventListener('click', dismiss); };
    toast.addEventListener('click', dismiss);
    setTimeout(dismiss, 4000);
}

/* ==== Skin Panel ==== */
function openSkinPanel() {
    renderSkinCards();
    document.getElementById('skin-backdrop').classList.add('show');
    /* Small delay for CSS transition */
    requestAnimationFrame(() => {
        document.getElementById('skin-panel').classList.add('show');
    });
}

function closeSkinPanel() {
    document.getElementById('skin-panel').classList.remove('show');
    document.getElementById('skin-backdrop').classList.remove('show');
}

function renderSkinCards() {
    const container = document.getElementById('skin-cards');
    if (!container) return;
    container.innerHTML = '';

    for (const skin of SKINS) {
        const card = document.createElement('div');
        const isUnlocked = wins >= skin.unlockWins;
        const isActive = currentSkinId === skin.id;

        card.className = 'skin-card';
        if (isActive) card.classList.add('active');
        if (!isUnlocked) card.classList.add('locked');

        /* Preview */
        const preview = document.createElement('div');
        preview.className = 'skin-preview';
        preview.style.background = skin.preview.board;

        /* Draw mini grid lines on preview */
        const cvs = document.createElement('canvas');
        cvs.width = 140; cvs.height = 56;
        const ctx = cvs.getContext('2d');
        ctx.strokeStyle = skin.preview.line;
        ctx.lineWidth = 1;
        for (let i = 0; i < 5; i++) {
            ctx.beginPath();
            ctx.moveTo(0, 8 + i * 10); ctx.lineTo(140, 8 + i * 10);
            ctx.stroke();
        }
        for (let i = 0; i < 9; i++) {
            ctx.beginPath();
            ctx.moveTo(10 + i * 15, 8); ctx.lineTo(10 + i * 15, 48);
            ctx.stroke();
        }
        preview.appendChild(cvs);
        card.appendChild(preview);

        /* Name */
        const nameEl = document.createElement('div');
        nameEl.className = 'skin-name';
        nameEl.textContent = skin.name;
        card.appendChild(nameEl);

        /* Description */
        const descEl = document.createElement('div');
        descEl.className = 'skin-desc';
        descEl.textContent = skin.desc;
        card.appendChild(descEl);

        /* Status badge */
        const statusEl = document.createElement('span');
        statusEl.className = 'skin-status';
        if (isActive) {
            statusEl.classList.add('using');
            statusEl.textContent = '使用中';
        } else if (isUnlocked) {
            statusEl.classList.add('unlocked');
            statusEl.textContent = '点击使用';
        } else {
            statusEl.classList.add('need');
            const need = skin.unlockWins - wins;
            statusEl.textContent = '再赢 ' + need + ' 局解锁';
        }
        card.appendChild(statusEl);

        /* Click handler */
        if (isUnlocked && !isActive) {
            card.addEventListener('click', () => {
                applySkin(skin.id);
                saveProfile();
                renderPieces();
            });
        }

        container.appendChild(card);
    }
}

function setPuzzleRetryVisible(show) {
    const btn = document.getElementById('btn-puzzle-retry');
    if (!btn) return;
    btn.classList.toggle('show', !!show);
}

function retryCurrentPuzzle() {
    invalidateAIRequests();
    if (!puzzleId) return;
    const current = PUZZLES.find(p => p.id === puzzleId);
    if (!current) return;
    startPuzzle(current);
}

function renderPuzzleList() {
    const list = document.getElementById('puzzle-list');
    if (!list) return;
    list.innerHTML = '';
    for (let i = 0; i < PUZZLES.length; i++) {
        const p = PUZZLES[i];
        const card = document.createElement('div');
        card.className = 'puzzle-card';
        const progress = puzzleProgress[p.id];
        const prevId = i > 0 ? PUZZLES[i - 1].id : null;
        const unlocked = i === 0 || (prevId && puzzleProgress[prevId] && puzzleProgress[prevId].cleared);
        if (!unlocked) card.classList.add('locked');

        const name = document.createElement('div');
        name.className = 'puzzle-name';
        name.textContent = p.name;

        const stars = document.createElement('div');
        stars.className = 'puzzle-stars';
        stars.textContent = '★'.repeat(p.stars);

        const meta = document.createElement('div');
        meta.className = 'puzzle-meta';
        meta.textContent = '限步: ' + p.maxMoves + ' 步';

        const hint = document.createElement('div');
        hint.className = 'puzzle-meta';
        hint.textContent = '提示: ' + (p.hint || '暂无');

        const status = document.createElement('div');
        status.className = 'puzzle-meta';
        if (progress && progress.cleared) {
            status.textContent = '已通关 · 最佳 ' + (progress.bestMoves || '-') + ' 步';
        } else {
            status.textContent = '未通关';
        }

        card.appendChild(stars);
        card.appendChild(name);
        card.appendChild(meta);
        card.appendChild(hint);
        card.appendChild(status);

        if (unlocked) {
            card.addEventListener('click', () => {
                startPuzzle(p);
                closePuzzlePanel();
            });
        }

        if (!unlocked) {
            status.textContent = '未解锁（需通关上一关）';
        }

        list.appendChild(card);
    }
}

function startPuzzle(puzzle) {
    invalidateAIRequests();
    matchReported = false;
    matchStartTs = 0;
    puzzleActive = true;
    puzzleId = puzzle.id;
    puzzleMoves = 0;
    puzzleMaxMoves = puzzle.maxMoves;
    puzzleSide = puzzle.side || 'r';
    setPuzzleRetryVisible(false);
    document.getElementById('info-bar').textContent = '提示: ' + (puzzle.hint || '暂无');
    board = puzzle.board.map(row => [...row]);
    selectedPos = null;
    validMoves = [];
    currentTurn = puzzleSide;
    gameOver = false;
    lastMove = null;
    lastCapture = null;
    lastCapturedPiece = null;
    history = [];
    showOverlay(false);
    updatePuzzleStatus();
    renderPieces();
}

function updatePuzzleStatus() {
    const remain = Math.max(0, puzzleMaxMoves - puzzleMoves);
    setStatus('残局挑战（剩余 ' + remain + ' 步）');
    if (!document.getElementById('info-bar').textContent.startsWith('提示')) {
        document.getElementById('info-bar').textContent =
            '残局模式 · 已用 ' + puzzleMoves + ' / ' + puzzleMaxMoves + ' 步';
    }
}

function markPuzzleCleared(id, movesUsed) {
    const record = puzzleProgress[id];
    if (!record || !record.cleared || movesUsed < (record.bestMoves || Infinity)) {
        puzzleProgress[id] = { cleared: true, bestMoves: movesUsed };
        saveProfile();
    }
}

    authMode = mode === 'register' ? 'register' : 'login';
    const isRegister = authMode === 'register';

function renderAuthState() {
    const summaryEl = document.getElementById('auth-summary');
    const hintEl = document.getElementById('rank-auth-hint');
    const loginBtn = document.getElementById('btn-auth-open');
    const logoutBtn = document.getElementById('btn-auth-logout');
    const nameInput = document.getElementById('player-name-input');

    if (authState.loggedIn && authState.user) {
        const displayName = authState.user.display_name || authState.user.username;
        playerName = String(displayName || '').slice(0, 24);
        saveProfile();
        if (summaryEl) summaryEl.textContent = `已登录：${displayName} (@${authState.user.username})`;
        if (hintEl) hintEl.textContent = '你已登录，战绩将计入全服排行榜。';
        if (loginBtn) loginBtn.textContent = '切换账号';
        if (logoutBtn) logoutBtn.style.display = '';
        if (nameInput) nameInput.value = playerName;
    } else {
        if (summaryEl) summaryEl.textContent = '游客模式（不上榜）';
        if (hintEl) hintEl.textContent = '全服排行榜仅展示已注册账号。';
        if (loginBtn) loginBtn.textContent = '登录/注册';
        if (logoutBtn) logoutBtn.style.display = 'none';
    }
}

async function fetchAuthState() {
    try {
        const data = await fetchJsonWithRetry('/api/auth/me', {}, 2, 5000);
        authState.loggedIn = !!data.logged_in;
        authState.user = data.user || null;
    } catch (error) {
        console.warn('auth state load failed:', error);
        authState.loggedIn = false;
        authState.user = null;
    }
    renderAuthState();
    return authState;
}

function openAuthPanel(defaultMode = 'login') {
    setAuthMode(defaultMode);
    const usernameInput = document.getElementById('auth-username');
    const passwordInput = document.getElementById('auth-password');
    const displayInput = document.getElementById('auth-display-name');
    if (usernameInput) usernameInput.value = '';
    if (passwordInput) passwordInput.value = '';
    if (displayInput) displayInput.value = playerName || '';
    setAuthStatus('');
    document.getElementById('auth-backdrop').classList.add('show');
    requestAnimationFrame(() => {
        document.getElementById('auth-panel').classList.add('show');
    });
}

function closeAuthPanel() {
    document.getElementById('auth-panel').classList.remove('show');
    document.getElementById('auth-backdrop').classList.remove('show');
    setAuthStatus('');
}

async function handleAuthSubmit() {
    const username = (document.getElementById('auth-username').value || '').trim();
    const password = document.getElementById('auth-password').value || '';
    const displayName = (document.getElementById('auth-display-name').value || '').trim();

    if (!username) {
        setAuthStatus('请输入用户名');
        return;
    }
    if (!password) {
        setAuthStatus('请输入密码');
        return;
    }

    const endpoint = authMode === 'register' ? '/api/auth/register' : '/api/auth/login';
    const payload = authMode === 'register'
        ? { username, password, display_name: displayName || playerName }
        : { username, password };

    try {
        const data = await fetchJsonWithRetry(
            endpoint,
            {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            },
            1,
            8000,
        );
        authState.loggedIn = !!data.logged_in;
        authState.user = data.user || null;
        renderAuthState();
        closeAuthPanel();
        setRankStatus(authMode === 'register' ? '注册成功，已登录' : '登录成功');
        await refreshRankData();
    } catch (error) {
        const msg = (error && error.message) ? error.message : '请求失败';
        setAuthStatus(`操作失败：${msg}`);
    }
}

async function handleAuthLogout() {
    try {
        await fetchJsonWithRetry(
            '/api/auth/logout',
            {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
            },
            1,
            5000,
        );
    } catch (error) {
        console.warn('logout failed:', error);
    }
    authState.loggedIn = false;
    authState.user = null;
    renderAuthState();
    switchRankTab('history');
    await refreshRankData();
}

async function savePlayerNameFromInput() {
    const input = document.getElementById('player-name-input');
    if (!input) return;
    playerName = (input.value || '').trim().slice(0, 24);
    input.value = playerName;

    if (authState.loggedIn) {
        try {
            const data = await fetchJsonWithRetry(
                '/api/auth/display-name',
                {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ display_name: playerName }),
                },
                1,
                5000,
            );
            authState.user = data.user || authState.user;
            renderAuthState();
            setRankStatus('昵称已更新到账号');
        } catch (error) {
            const msg = (error && error.message) ? error.message : '请求失败';
            setRankStatus(`昵称保存失败：${msg}`);
        }
    } else {
        saveProfile();
        setRankStatus('昵称已保存（本机）');
    }
}

function formatMatchTime(ts) {
    if (!ts) return '-';
    const d = new Date(ts * 1000);
    return d.toLocaleString();
}

function formatDuration(sec) {
    if (!sec || sec < 0) return '-';
    return sec.toFixed(1) + 's';
}

function calcCurrentMatchDurationSec() {
    if (!matchStartTs) return null;
    const duration = (Date.now() - matchStartTs) / 1000;
    return Math.max(0, Number(duration.toFixed(1)));
}

function escapeHtml(value) {
    const text = String(value == null ? '' : value);
    return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function getDifficultyLabel(diff, charId) {
    if (charId && CHARACTER_NAMES[charId]) {
        return CHARACTER_NAMES[charId];
    }
    if (!diff) return '-';
    if (DIFFICULTIES[diff]) return DIFFICULTIES[diff].name;
    return diff;
}

function renderHistoryList(matches) {
    const list = document.getElementById('history-list');
    if (!list) return;
    list.innerHTML = '';
    if (!matches || matches.length === 0) {
        list.innerHTML = '<div class="rank-empty">暂无历史对局，先去下一局吧。</div>';
        return;
    }
    for (const m of matches) {
        const item = document.createElement('div');
        item.className = 'rank-item';
        const resultLabel = m.result === 'win' ? '胜利' : (m.result === 'lose' ? '失败' : '平局');
        const difficultyLabel = getDifficultyLabel(m.difficulty, m.character_id);
        const timeoutLabel = m.search_timed_out ? ' | 极速决策' : '';
        const nodesLabel = (typeof m.nodes === 'number' && m.nodes >= 0) ? String(m.nodes) : '-';
        item.innerHTML = `
            <div class="rank-item-head">
                <div class="rank-item-name">${escapeHtml(resultLabel)}</div>
                <div class="rank-item-meta">${formatMatchTime(m.created_ts)}</div>
            </div>
            <div class="rank-item-meta">难度: ${escapeHtml(difficultyLabel)} | 用时: ${formatDuration(m.duration_sec)}${escapeHtml(timeoutLabel)}</div>
            <div class="rank-item-meta">节点: ${nodesLabel}</div>
        `;
        list.appendChild(item);
    }
}

function renderLeaderboardList(entries) {
    const list = document.getElementById('leaderboard-list');
    if (!list) return;
    list.innerHTML = '';
    if (!entries || entries.length === 0) {
        list.innerHTML = '<div class="rank-empty">暂无排行榜数据。</div>';
        return;
    }
    for (const e of entries) {
        const item = document.createElement('div');
        item.className = 'rank-item';
        const playerNameLabel = escapeHtml(e.player_name || '-');
        const winRateLabel = typeof e.win_rate === 'number' ? e.win_rate.toFixed(1) : '0.0';
        item.innerHTML = `
            <div class="rank-item-head">
                <div class="rank-item-name">#${e.rank} ${playerNameLabel}</div>
                <div class="rank-item-meta">胜率 ${winRateLabel}%</div>
            </div>
            <div class="rank-item-meta">战绩: ${e.wins}胜 ${e.losses}负 ${e.draws}平 | 总场次 ${e.games}</div>
            <div class="rank-item-meta">最近对局: ${formatMatchTime(e.last_played_ts)}</div>
        `;
        list.appendChild(item);
    }
}

function switchRankTab(tab) {
    if (tab === 'leaderboard' && !authState.loggedIn) {
        setRankStatus('登录后可查看全服排行榜');
        const list = document.getElementById('leaderboard-list');
        if (list) {
            list.innerHTML = '<div class="rank-empty">请先登录或注册账号，再查看全服排行。</div>';
        }
        openAuthPanel('login');
        return;
    }

    const historyTab = document.getElementById('tab-history');
    const rankTab = document.getElementById('tab-leaderboard');
    const historyList = document.getElementById('history-list');
    const leaderboardList = document.getElementById('leaderboard-list');
    if (!historyTab || !rankTab || !historyList || !leaderboardList) return;

    const showHistory = tab === 'history';
    historyTab.classList.toggle('active', showHistory);
    rankTab.classList.toggle('active', !showHistory);
    historyList.classList.toggle('show', showHistory);
    leaderboardList.classList.toggle('show', !showHistory);
}

async function refreshRankData() {
    try {
        setRankStatus('加载中...');
        const uid = heartbeatUid || getOrCreateHeartbeatUid();
        const historyUrl = authState.loggedIn
            ? '/api/match-history?limit=20'
            : `/api/match-history?uid=${encodeURIComponent(uid)}&limit=20`;
        const historyData = await fetchJsonWithRetry(historyUrl, {}, 2, 5000);
        renderHistoryList(historyData.matches || []);

        if (authState.loggedIn) {
            const leaderboardData = await fetchJsonWithRetry('/api/leaderboard?scope=all&mode=free&limit=20', {}, 2, 5000);
            renderLeaderboardList(leaderboardData.entries || []);
        } else {
            const leaderboardList = document.getElementById('leaderboard-list');
            if (leaderboardList) {
                leaderboardList.innerHTML = '<div class="rank-empty">登录后可查看并参与全服排行。</div>';
            }
        }
        setRankStatus('');
    } catch (error) {
        console.error('Failed to load rank data:', error);
        setRankStatus('加载失败，请稍后重试');
    }
}

async function openRankPanel() {
    const input = document.getElementById('player-name-input');
    if (input) {
        input.value = playerName || '';
    }
    document.getElementById('rank-backdrop').classList.add('show');
    requestAnimationFrame(() => {
        document.getElementById('rank-panel').classList.add('show');
    });
    switchRankTab('history');
    await fetchAuthState();
    await refreshRankData();
}

function closeRankPanel() {
    document.getElementById('rank-panel').classList.remove('show');
    document.getElementById('rank-backdrop').classList.remove('show');
    closeAuthPanel();
    setRankStatus('');
}

async function reportMatchResultOnce(result, extra = {}) {
    if (puzzleActive || matchReported) return;
    const uid = heartbeatUid || getOrCreateHeartbeatUid();
    heartbeatUid = uid;
    matchReported = true;
    const durationSec = (typeof extra.durationSec === 'number' && extra.durationSec >= 0)
        ? extra.durationSec
        : calcCurrentMatchDurationSec();

    const payload = {
        uid,
        player_name: getActivePlayerName(),
        result,
        mode: 'free',
        difficulty: currentDifficulty,
        character_id: isCharacterMode(currentDifficulty) ? currentDifficulty : '',
        duration_sec: durationSec,
        nodes: extra.nodes,
        search_timed_out: !!extra.searchTimedOut,
    };

    try {
        await fetchJsonWithRetry(
            '/api/match-result',
            {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            },
            2,
            5000,
        );
    } catch (error) {
        console.warn('match result report failed:', error);
    }
}

/* ================================================================
   Board Drawing (SVG) — reads skin colors
   ================================================================ */
function drawBoard() {
    const svg = document.getElementById('board-svg');
    svg.innerHTML = '';
    const ns = 'http://www.w3.org/2000/svg';
    const skin = getSkin(currentSkinId);
    const lineColor = skin.vars['--line-color'];
    const riverColor = skin.vars['--river-text'];

    function addLine(x1, y1, x2, y2, w) {
        const el = document.createElementNS(ns, 'line');
        el.setAttribute('x1', x1); el.setAttribute('y1', y1);
        el.setAttribute('x2', x2); el.setAttribute('y2', y2);
        el.setAttribute('stroke', lineColor);
        el.setAttribute('stroke-width', w || 1.5);
        svg.appendChild(el);
    }

    function addText(x, y, text, size) {
        const el = document.createElementNS(ns, 'text');
        el.setAttribute('x', x); el.setAttribute('y', y);
        el.setAttribute('text-anchor', 'middle');
        el.setAttribute('dominant-baseline', 'central');
        el.setAttribute('font-size', size || 26);
        el.setAttribute('fill', riverColor);
        el.setAttribute('font-family', 'KaiTi, STKaiti, FangSong, serif');
        el.setAttribute('opacity', '0.75');
        el.textContent = text;
        svg.appendChild(el);
    }

    /* Outer border */
    const bx = HALF - 4, by = HALF - 4;
    const bw = 8 * CS + 8, bh = 9 * CS + 8;
    const rect = document.createElementNS(ns, 'rect');
    rect.setAttribute('x', bx); rect.setAttribute('y', by);
    rect.setAttribute('width', bw); rect.setAttribute('height', bh);
    rect.setAttribute('fill', 'none');
    rect.setAttribute('stroke', lineColor);
    rect.setAttribute('stroke-width', 2.5);
    svg.appendChild(rect);

    /* Horizontal lines */
    for (let r = 0; r < 10; r++) {
        addLine(HALF, r * CS + HALF, 8 * CS + HALF, r * CS + HALF);
    }
    /* Vertical lines — top half */
    for (let c = 0; c < 9; c++) {
        addLine(c * CS + HALF, HALF, c * CS + HALF, 4 * CS + HALF);
    }
    /* Vertical lines — bottom half */
    for (let c = 0; c < 9; c++) {
        addLine(c * CS + HALF, 5 * CS + HALF, c * CS + HALF, 9 * CS + HALF);
    }
    /* Edge verticals across river */
    addLine(HALF, 4 * CS + HALF, HALF, 5 * CS + HALF);
    addLine(8 * CS + HALF, 4 * CS + HALF, 8 * CS + HALF, 5 * CS + HALF);

    /* Palace diagonals */
    addLine(3*CS+HALF, 0*CS+HALF, 5*CS+HALF, 2*CS+HALF);
    addLine(5*CS+HALF, 0*CS+HALF, 3*CS+HALF, 2*CS+HALF);
    addLine(3*CS+HALF, 7*CS+HALF, 5*CS+HALF, 9*CS+HALF);
    addLine(5*CS+HALF, 7*CS+HALF, 3*CS+HALF, 9*CS+HALF);

    /* Star marks */
    const stars = [
        [2,1],[2,7],[7,1],[7,7],
        [3,0],[3,2],[3,4],[3,6],[3,8],
        [6,0],[6,2],[6,4],[6,6],[6,8],
    ];
    const sd = 5, sl = 11;
    for (const [row, col] of stars) {
        const cx = col * CS + HALF, cy = row * CS + HALF;
        if (col < 8) {
            addLine(cx+sd, cy-sd, cx+sl, cy-sd, 1);
            addLine(cx+sd, cy-sd, cx+sd, cy-sl, 1);
            addLine(cx+sd, cy+sd, cx+sl, cy+sd, 1);
            addLine(cx+sd, cy+sd, cx+sd, cy+sl, 1);
        }
        if (col > 0) {
            addLine(cx-sd, cy-sd, cx-sl, cy-sd, 1);
            addLine(cx-sd, cy-sd, cx-sd, cy-sl, 1);
            addLine(cx-sd, cy+sd, cx-sl, cy+sd, 1);
            addLine(cx-sd, cy+sd, cx-sd, cy+sl, 1);
        }
    }

    /* River text */
    addText(2 * CS + HALF, 4.5 * CS + HALF, '楚  河', 30);
    addText(6 * CS + HALF, 4.5 * CS + HALF, '漢  界', 30);
}
